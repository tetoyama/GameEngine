name: AgentOS Core Tests

on:
  push:
    branches:
      - llm-agent
    paths:
      - "Source/GameApplication/AgentOS/Core/**"
      - "Tests/AgentOS*"
      - "Tests/AgentOS/**"
      - ".github/workflows/agentos-core-tests.yml"
  pull_request:
    paths:
      - "Source/GameApplication/AgentOS/Core/**"
      - "Tests/AgentOS*"
      - "Tests/AgentOS/**"
      - ".github/workflows/agentos-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-agentos-ui-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout llm-agent
        uses: actions/checkout@v4
        with:
          ref: llm-agent
          fetch-depth: 0
          show-progress: false

      - name: Extract and run one-shot patch
        shell: bash
        run: |
          set -o pipefail
          sed -n "/python - <<'PY'/,/^          PY$/p" \
            .github/workflows/agentos-ui-tooltip-patch.yml \
            | sed '1d;$d;s/^          //' > /tmp/agentos-ui-patch.py
          python /tmp/agentos-ui-patch.py 2>&1 | tee /tmp/agentos-ui-patch.log

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentos-ui-patch-log
          path: /tmp/agentos-ui-patch.log
          if-no-files-found: error

      - name: Restore workflow and commit source changes
        shell: bash
        run: |
          git show d26e396a5b38f3e1a5a716d65f8b7d2c214bf31c:.github/workflows/agentos-core-tests.yml \
            > .github/workflows/agentos-core-tests.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show AgentOS prompts, outputs, and worker agents"
          git push origin HEAD:llm-agent

  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run AgentOS core tests
        shell: bash
        run: |
          set -o pipefail
          make -f Tests/AgentOS/Makefile -j2 2>&1 | tee agentos-core-tests.log

      - name: Upload AgentOS test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentos-core-test-log
          path: agentos-core-tests.log
          if-no-files-found: error
