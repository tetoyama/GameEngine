name: AgentOS Core Tests

on:
  push:
    branches:
      - llm-agent
    paths:
      - "Source/GameApplication/AgentOS/Core/**"
      - "Tests/AgentOS*"
      - "Tests/AgentOS/**"
      - ".github/workflows/agentos-core-tests.yml"
  pull_request:
    paths:
      - "Source/GameApplication/AgentOS/Core/**"
      - "Tests/AgentOS*"
      - "Tests/AgentOS/**"
      - ".github/workflows/agentos-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-component-query-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout llm-agent
        uses: actions/checkout@v4
        with:
          ref: llm-agent
          fetch-depth: 0
          show-progress: false

      - name: Extract and run component patch
        shell: bash
        run: |
          set -o pipefail
          sed -n "/python3 - <<'PY'/,/^          PY$/p" \
            .github/workflows/agentos-component-query-fix.yml \
            | sed '1d;$d;s/^          //' > /tmp/agentos-component-query-fix.py
          python3 /tmp/agentos-component-query-fix.py 2>&1 | tee /tmp/agentos-component-query-fix.log

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentos-component-query-fix-log
          path: /tmp/agentos-component-query-fix.log
          if-no-files-found: error

      - name: Restore workflow and commit source changes
        shell: bash
        run: |
          git show d26e396a5b38f3e1a5a716d65f8b7d2c214bf31c:.github/workflows/agentos-core-tests.yml \
            > .github/workflows/agentos-core-tests.yml
          rm -f .github/workflows/agentos-component-query-fix.yml
          sed -i 's/[[:space:]]\+$//' \
            Source/GameApplication/AgentOS/Core/Logic/ComponentQueryRouting.h \
            Source/GameApplication/AgentOS/Core/Command/CommandPipeline.cpp \
            Source/GameApplication/AgentOS/Core/Llm/PromptTemplates.cpp \
            Source/GameApplication/AgentOS/Service/AgentOSService.cpp \
            Tests/AgentOSComponentQueryRoutingSmokeTest.cpp \
            Tests/AgentOS/Makefile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --check
          git commit -m "Fix AgentOS component query grounding"
          git push origin HEAD:llm-agent

  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run AgentOS core tests
        shell: bash
        run: |
          set -o pipefail
          make -f Tests/AgentOS/Makefile -j2 2>&1 | tee agentos-core-tests.log

      - name: Upload AgentOS test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentos-core-test-log
          path: agentos-core-tests.log
          if-no-files-found: error
