name: GPU Pass Timing Contract

on:
  pull_request:
    branches: [master]
    paths:
      - "Source/GameApplication/Service/Graphics/GpuFrameTiming.h"
      - "Source/GameApplication/Service/Graphics/GpuPassTimingProfiler.h"
      - "Source/GameApplication/Service/Graphics/mainRenderer.h"
      - "Source/GameApplication/Engine/engine.cpp"
      - "Source/GameApplication/Engine/Scene/System/Render/RenderSystem/RenderPass/PlayerView/PlayerPass.cpp"
      - "Source/GameApplication/Engine/Scene/System/Render/RenderSystem/RenderPass/EditorView/EditorPass.cpp"
      - "Source/GameApplication/Engine/Editor/UI/PerformanceMonitor.h"
      - "Source/GameApplication/Engine/Editor/UI/PerformanceMonitor.cpp"
      - "Source/GameApplication/AgentOS/UI/AgentOSPanel.cpp"
      - "Tests/GpuPassTimingContractSmokeTest.cpp"
      - ".github/workflows/gpu-pass-timing.yml"
  push:
    branches: [refactor/ecs-scheduler-foundation]
    paths:
      - "Source/GameApplication/Service/Graphics/GpuFrameTiming.h"
      - "Source/GameApplication/Service/Graphics/GpuPassTimingProfiler.h"
      - "Source/GameApplication/Service/Graphics/mainRenderer.h"
      - "Source/GameApplication/Engine/engine.cpp"
      - "Source/GameApplication/Engine/Scene/System/Render/RenderSystem/RenderPass/PlayerView/PlayerPass.cpp"
      - "Source/GameApplication/Engine/Scene/System/Render/RenderSystem/RenderPass/EditorView/EditorPass.cpp"
      - "Source/GameApplication/Engine/Editor/UI/PerformanceMonitor.h"
      - "Source/GameApplication/Engine/Editor/UI/PerformanceMonitor.cpp"
      - "Tests/GpuPassTimingContractSmokeTest.cpp"
      - ".github/workflows/gpu-pass-timing.yml"
  workflow_dispatch:

concurrency:
  group: gpu-pass-timing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-agentos-imgui-id-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: llm-agent
          fetch-depth: 0
      - name: Apply scoped phase IDs
        shell: python
        run: |
          from pathlib import Path

          path = Path("Source/GameApplication/AgentOS/UI/AgentOSPanel.cpp")
          text = path.read_text(encoding="utf-8")
          old = '''\t\tImGui::SetCursorScreenPos(itemMin);
\t\tImGui::InvisibleButton("phase", ImVec2(itemWidth, height - 8.0f));
\t\tif(ImGui::IsItemHovered()) {
\t\t\tImGui::BeginTooltip();
\t\t\tImGui::TextColored(color, "%s", phase.label);
\t\t\tImGui::SameLine();
\t\t\tImGui::TextDisabled("%s", PhaseStatusText(state));
\t\t\tImGui::TextWrapped("%s", phase.caption);
\t\t\tif(active) {
\t\t\t\tconst std::string operation = CurrentOperationLabel(snapshot, audit);
\t\t\t\tif(!operation.empty()) {
\t\t\t\t\tImGui::Separator();
\t\t\t\t\tImGui::Text("現在: %s", operation.c_str());
\t\t\t\t}
\t\t\t\tif(snapshot.progressDetail.is_object() &&
\t\t\t\t\t!snapshot.progressDetail.empty()) {
\t\t\t\t\tImGui::TextDisabled("%s", TruncateText(
\t\t\t\t\t\tsnapshot.progressDetail.dump(2), 700).c_str());
\t\t\t\t}
\t\t\t}
\t\t\tImGui::EndTooltip();
\t\t}
'''
          new = '''\t\t// Rail instance IDに加えてPhase固有IDを積み、各Hit Targetを一意にする。
\t\tImGui::PushID(phase.stage);
\t\tImGui::SetCursorScreenPos(itemMin);
\t\tImGui::InvisibleButton("##HitTarget", ImVec2(itemWidth, height - 8.0f));
\t\tif(ImGui::IsItemHovered()) {
\t\t\tImGui::BeginTooltip();
\t\t\tImGui::TextColored(color, "%s", phase.label);
\t\t\tImGui::SameLine();
\t\t\tImGui::TextDisabled("%s", PhaseStatusText(state));
\t\t\tImGui::TextWrapped("%s", phase.caption);
\t\t\tif(active) {
\t\t\t\tconst std::string operation = CurrentOperationLabel(snapshot, audit);
\t\t\t\tif(!operation.empty()) {
\t\t\t\t\tImGui::Separator();
\t\t\t\t\tImGui::Text("現在: %s", operation.c_str());
\t\t\t\t}
\t\t\t\tif(snapshot.progressDetail.is_object() &&
\t\t\t\t\t!snapshot.progressDetail.empty()) {
\t\t\t\t\tImGui::TextDisabled("%s", TruncateText(
\t\t\t\t\t\tsnapshot.progressDetail.dump(2), 700).c_str());
\t\t\t\t}
\t\t\t}
\t\t\tImGui::EndTooltip();
\t\t}
\t\tImGui::PopID();
'''
          count = text.count(old)
          if count == 0 and 'ImGui::InvisibleButton("##HitTarget"' in text:
              print("Phase IDs already fixed")
          elif count != 1:
              raise SystemExit(f"expected exactly one phase hit-target block, found {count}")
          else:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/GameApplication/AgentOS/UI/AgentOSPanel.cpp
          git commit -m "Fix AgentOS phase rail ImGui ID conflicts"
          git push origin HEAD:llm-agent

  gpu-pass-timing-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile and run GPU pass timing contract
        shell: cmd
        run: >-
          cl /nologo /utf-8 /std:c++20 /EHsc /W4 /WX /MTd
          /D_CRT_SECURE_NO_WARNINGS
          /wd4100 /wd4201 /wd4458 /wd4471
          /I Source
          /I Source/GameApplication
          /I Source/GameApplication/Service
          Tests/GpuPassTimingContractSmokeTest.cpp
          /Fe:gpu-pass-timing-contract-test.exe
          && gpu-pass-timing-contract-test.exe
