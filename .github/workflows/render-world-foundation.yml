name: RenderWorld Foundation Smoke Test

on:
  pull_request:
    branches: [master]
    paths:
      - "Source/GameApplication/Engine/Scene/System/Render/RenderSystem/RenderWorld/RenderWorld.h"
      - "Source/GameApplication/Engine/Scene/System/Render/RenderSystem/RenderPacket/**"
      - "Source/GameApplication/Engine/Scene/System/Render/Culling/**"
      - "Tests/RenderWorldFoundationSmokeTest.cpp"
      - ".github/workflows/render-world-foundation.yml"
  push:
    branches: [refactor/ecs-scheduler-foundation]
    paths:
      - "Source/GameApplication/Engine/Scene/System/Render/RenderSystem/RenderWorld/RenderWorld.h"
      - "Source/GameApplication/Engine/Scene/System/Render/RenderSystem/RenderPacket/**"
      - "Source/GameApplication/Engine/Scene/System/Render/Culling/**"
      - "Tests/RenderWorldFoundationSmokeTest.cpp"
      - ".github/workflows/render-world-foundation.yml"
  workflow_dispatch:

concurrency:
  group: render-world-foundation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile and run RenderWorld foundation contract
        shell: cmd
        run: >-
          cl /nologo /utf-8 /std:c++20 /EHsc /W4 /WX
          /D_CRT_SECURE_NO_WARNINGS
          /wd4100 /wd4201 /wd4458 /wd4471 /MTd
          /I Source
          /I Source/GameApplication
          /I Source/GameApplication/Backends
          /I Source/GameApplication/Engine
          /I Source/GameApplication/Engine/Scene
          /I Source/GameApplication/Service
          Tests/RenderWorldFoundationSmokeTest.cpp
          /Fe:render-world-foundation-test.exe
          /link /NODEFAULTLIB:yaml-cppd.lib
          && render-world-foundation-test.exe
