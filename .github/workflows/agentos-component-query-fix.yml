name: AgentOS Component Query Fix

on:
  push:
    branches: [llm-agent]
    paths:
      - ".github/workflows/agentos-component-query-fix.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: llm-agent
          fetch-depth: 0

      - name: Apply component query safeguards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          routing = r'''// =======================================================================
          //
          // ComponentQueryRouting.h
          //
          // Entity / Componentの読み取り要求を、LLM解釈に依存せず既存Toolへ束縛する。
          // =======================================================================
          #pragma once

          #include <algorithm>
          #include <cctype>
          #include <string>

          #include "../Json.h"

          namespace agentos::componentquery {

          struct Route {
              std::string tool;
              Json arguments = Json::object();

              bool IsValid() const noexcept { return !tool.empty(); }
          };

          inline bool ContainsAny(const std::string& text,
                                  std::initializer_list<const char*> needles) {
              for(const char* needle : needles) {
                  if(needle != nullptr && text.find(needle) != std::string::npos) return true;
              }
              return false;
          }

          inline std::string ExtractQuotedEntity(const std::string& request) {
              struct Marker { const char* prefix; char suffix; };
              constexpr Marker markers[] = {
                  {"Entity '", '\''}, {"entity '", '\''},
                  {"Entity \"", '\"'}, {"entity \"", '\"'},
              };
              for(const Marker& marker : markers) {
                  const std::size_t begin = request.find(marker.prefix);
                  if(begin == std::string::npos) continue;
                  const std::size_t valueBegin = begin + std::char_traits<char>::length(marker.prefix);
                  const std::size_t end = request.find(marker.suffix, valueBegin);
                  if(end != std::string::npos && end > valueBegin) {
                      return request.substr(valueBegin, end - valueBegin);
                  }
              }
              return {};
          }

          inline std::string AsciiIdentifierBefore(const std::string& text, std::size_t pos) {
              std::size_t end = pos;
              while(end > 0 && std::isspace(static_cast<unsigned char>(text[end - 1])) != 0) --end;
              std::size_t begin = end;
              while(begin > 0) {
                  const unsigned char ch = static_cast<unsigned char>(text[begin - 1]);
                  if(std::isalnum(ch) == 0 && ch != '_') break;
                  --begin;
              }
              return begin < end ? text.substr(begin, end - begin) : std::string();
          }

          inline std::string ExtractEntityBeforeParticle(const std::string& request) {
              for(const char* marker : {"になん", "に何", "のコンポーネント", "のComponent"}) {
                  const std::size_t pos = request.find(marker);
                  if(pos == std::string::npos) continue;
                  const std::string entity = AsciiIdentifierBefore(request, pos);
                  if(!entity.empty()) return entity;
              }
              return {};
          }

          inline std::string ExtractComponentName(const std::string& request) {
              if(ContainsAny(request, {"ライトコンポーネント", "ライトComponent"})) {
                  return "LightComponent";
              }

              std::size_t search = 0;
              while(true) {
                  const std::size_t suffix = request.find("Component", search);
                  if(suffix == std::string::npos) break;
                  std::size_t begin = suffix;
                  while(begin > 0) {
                      const unsigned char ch = static_cast<unsigned char>(request[begin - 1]);
                      if(std::isalnum(ch) == 0 && ch != '_') break;
                      --begin;
                  }
                  if(begin < suffix) return request.substr(begin, suffix + 9 - begin);
                  search = suffix + 9;
              }
              return {};
          }

          inline std::string EntityFromComponent(const std::string& component) {
              constexpr const char* suffix = "Component";
              constexpr std::size_t suffixLength = 9;
              if(component.size() > suffixLength &&
                 component.compare(component.size() - suffixLength, suffixLength, suffix) == 0) {
                  return component.substr(0, component.size() - suffixLength);
              }
              return {};
          }

          inline Route Resolve(const std::string& request) {
              if(ContainsAny(request, {
                  "今のシーンの状況", "現在のシーンの状況", "シーンの現状",
                  "current scene status", "scene status"
              })) {
                  return {"ListEntities", Json::object({{"maxCount", 100}})};
              }

              const std::string component = ExtractComponentName(request);
              std::string entity = ExtractQuotedEntity(request);
              if(entity.empty() && !component.empty()) entity = EntityFromComponent(component);
              if(entity.empty()) entity = ExtractEntityBeforeParticle(request);

              if(!component.empty() && !entity.empty()) {
                  return {"ReadComponent", Json::object({
                      {"entityName", entity},
                      {"component", component},
                  })};
              }

              const bool componentQuestion = ContainsAny(request, {
                  "コンポーネント", "Component", "component", "にも"
              });
              if(!entity.empty() && componentQuestion) {
                  return {"DescribeEntity", Json::object({{"entityName", entity}})};
              }
              return {};
          }

          inline bool PayloadSatisfied(const Json& payload) {
              if(!payload.is_object()) return true;
              if(payload.contains("error")) return false;
              if(payload.contains("found") && payload.at("found").is_boolean() &&
                 !payload.at("found").get<bool>()) return false;
              if(payload.contains("exists") && payload.at("exists").is_boolean() &&
                 !payload.at("exists").get<bool>()) return false;
              if(payload.contains("satisfied") && payload.at("satisfied").is_boolean() &&
                 !payload.at("satisfied").get<bool>()) return false;
              return true;
          }

          inline std::string BuildReply(const Route& route, const Json& payload) {
              if(!route.IsValid()) return {};

              if(route.tool == "ListEntities") {
                  const Json entities = payload.value("entities", Json::array());
                  if(!entities.is_array()) return "現在のSceneのEntity一覧を解釈できませんでした。";
                  std::string out = "現在のSceneで生存しているEntityは" +
                      std::to_string(entities.size()) + "件です。";
                  for(std::size_t i = 0; i < entities.size(); ++i) {
                      const Json& entry = entities[i];
                      const std::string name = entry.is_object()
                          ? entry.value("name", std::string("(unnamed)"))
                          : std::string("(unknown)");
                      out += "\n" + std::to_string(i + 1) + ". " + name;
                  }
                  out += "\n\nこの結果はEntity一覧の観測であり、各EntityのComponentが空であることは意味しません。";
                  return out;
              }

              const std::string entity = route.arguments.value("entityName", std::string());
              if(payload.is_object() && payload.contains("error")) {
                  return "Entity '" + entity + "' の読み取りに失敗しました: " +
                      payload.value("error", std::string("unknown error"));
              }

              if(route.tool == "DescribeEntity") {
                  const Json components = payload.value("components", Json::array());
                  if(!components.is_array()) {
                      return "Entity '" + entity + "' のComponent一覧を解釈できませんでした。";
                  }
                  std::string out = "Entity '" + entity + "' には" +
                      std::to_string(components.size()) + "件のComponentがあります。";
                  for(std::size_t i = 0; i < components.size(); ++i) {
                      const Json& entry = components[i];
                      const std::string name = entry.is_object()
                          ? entry.value("component", std::string("(unknown)"))
                          : std::string("(unknown)");
                      out += "\n" + std::to_string(i + 1) + ". " + name;
                  }
                  return out;
              }

              if(route.tool == "ReadComponent") {
                  const std::string component = route.arguments.value("component", std::string());
                  if(!payload.is_object() || !payload.contains("value")) {
                      return "Entity '" + entity + "' のComponent '" + component +
                          "' の値を取得できませんでした。";
                  }
                  return "Entity '" + entity + "' の " + component + " の現在値です。\n```json\n" +
                      payload.at("value").dump(2) + "\n```";
              }
              return {};
          }

          } // namespace agentos::componentquery
          '''
          Path('Source/GameApplication/AgentOS/Core/Logic/ComponentQueryRouting.h').write_text(
              '\n'.join(line[10:] if line.startswith('          ') else line for line in routing.splitlines()) + '\n',
              encoding='utf-8')

          service = 'Source/GameApplication/AgentOS/Service/AgentOSService.cpp'
          replace_once(service,
              '#include "../Core/Llm/PromptTemplates.h"\n#include "../Core/Orchestrator/Orchestrator.h"',
              '#include "../Core/Llm/PromptTemplates.h"\n#include "../Core/Logic/ComponentQueryRouting.h"\n#include "../Core/Orchestrator/Orchestrator.h"')

          replace_once(service,
              '''FastPathRoute ResolveFastPath(const std::string& request) {
\tif(IsContextDependentRequest(request)) return {};

\tconst std::string lower = LowerAscii(request);''',
              '''FastPathRoute ResolveFastPath(const std::string& request) {
\tconst componentquery::Route observationRoute = componentquery::Resolve(request);
\tif(observationRoute.IsValid()) {
\t\tFastPathRoute route;
\t\troute.kind = FastPathKind::Tool;
\t\troute.tool = observationRoute.tool;
\t\troute.arguments = observationRoute.arguments;
\t\treturn route;
\t}
\tif(IsContextDependentRequest(request)) return {};

\tconst std::string lower = LowerAscii(request);''')

          replace_once(service,
              '''\t\tif(result.IsOk()){
\t\t\tsourcePayload = result.payload;
\t\t} else {''',
              '''\t\tif(result.IsOk()){
\t\t\tsourcePayload = result.payload;
\t\t\tif(!componentquery::PayloadSatisfied(sourcePayload)) {
\t\t\t\tsourceSucceeded = false;
\t\t\t\tsourceError = sourcePayload.value("error", std::string("requested observation was not satisfied"));
\t\t\t}
\t\t} else {''')

          replace_once(service,
              '''\tstd::string report;
\tconst Result generationResult = GenerateFastPathReply(
\t\tgenerationContext,
\t\trequest,
\t\troute.tool,
\t\tsourcePayload,
\t\t&report
\t);''',
              '''\tstd::string report;
\tResult generationResult;
\tif(route.kind == FastPathKind::Tool) {
\t\tcomponentquery::Route observationRoute{route.tool, route.arguments};
\t\treport = componentquery::BuildReply(observationRoute, sourcePayload);
\t\tgenerationResult = report.empty()
\t\t\t? Result::Fail("deterministic tool response formatter returned no reply")
\t\t\t: Result::Ok();
\t} else {
\t\tgenerationResult = GenerateFastPathReply(
\t\t\tgenerationContext,
\t\t\trequest,
\t\t\troute.tool,
\t\t\tsourcePayload,
\t\t\t&report
\t\t);
\t}''')

          replace_once(service,
              '''\t\tm_taskStore.UpdateTaskState(taskId, TaskState::Succeeded);''',
              '''\t\tm_taskStore.UpdateTaskState(
\t\t\ttaskId,
\t\t\tsourceSucceeded ? TaskState::Succeeded : TaskState::Failed);''')

          replace_once(service,
              '''\tconst std::string taskType = route.kind == FastPathKind::Tool
\t\t? "DirectReadToolWithGeneration"
\t\t: "CapabilityReplyWithGeneration";''',
              '''\tconst std::string taskType = route.kind == FastPathKind::Tool
\t\t? "DirectReadToolDeterministic"
\t\t: "CapabilityReplyWithGeneration";''')

          replace_once(service,
              '''{"generatedBy", "local_llm"},''',
              '''{"generatedBy", route.kind == FastPathKind::Tool
\t\t\t\t\t? "deterministic_formatter"
\t\t\t\t\t: "local_llm"},''')

          replace_once(service,
              '''{"responseGeneratedBy", "local_llm"}},''',
              '''{"responseGeneratedBy", route.kind == FastPathKind::Tool
\t\t\t ? "deterministic_formatter"
\t\t\t : "local_llm"}},''')

          pipeline = 'Source/GameApplication/AgentOS/Core/Command/CommandPipeline.cpp'
          replace_once(pipeline,
              '''namespace agentos {

CommandPipeline::CommandPipeline''',
              '''namespace agentos {

namespace {

void NormalizeKnownArgumentAliases(CommandRequest* request) {
\tif(request == nullptr || !request->arguments.is_object()) return;
\tJson& arguments = request->arguments;
\tauto moveStringAlias = [&arguments](const char* alias, const char* canonical) {
\t\tif(!arguments.contains(alias) || !arguments.at(alias).is_string()) return;
\t\tif(!arguments.contains(canonical)) arguments[canonical] = arguments.at(alias);
\t\targuments.erase(alias);
\t};

\tif(request->tool == "ReadComponent") {
\t\tmoveStringAlias("entityId", "entityName");
\t\tmoveStringAlias("name", "entityName");
\t\tmoveStringAlias("componentName", "component");
\t\tmoveStringAlias("componentType", "component");
\t} else if(request->tool == "DescribeEntity") {
\t\tmoveStringAlias("name", "entityName");
\t} else if(request->tool == "FindEntityByName") {
\t\tmoveStringAlias("entityName", "name");
\t}
}

} // namespace

CommandPipeline::CommandPipeline''')

          replace_once(pipeline,
              '''\tif(request.id == kInvalidId){
\t\trequest.id = nextCommandId_.fetch_add(1);
\t}

\tstd::shared_ptr<ICommandExecutor> tool;''',
              '''\tif(request.id == kInvalidId){
\t\trequest.id = nextCommandId_.fetch_add(1);
\t}
\tNormalizeKnownArgumentAliases(&request);

\tstd::shared_ptr<ICommandExecutor> tool;''')

          prompts = 'Source/GameApplication/AgentOS/Core/Llm/PromptTemplates.cpp'
          replace_once(prompts,
              '''\t\t"- 『私/わたし/僕』『あなた』をScene Entity名へ変換しない。\\n"
\t\t"- 履歴に根拠がない参照は推測せずunresolvedReferencesへ入れる。\\n"''',
              '''\t\t"- 『私/わたし/僕』『あなた』をScene Entity名へ変換しない。\\n"
\t\t"- 『設定を教えて』『値を教えて』は現在値の読み取りだけを意味し、変更手順や変更操作を追加しない。\\n"
\t\t"- 履歴に根拠がない参照は推測せずunresolvedReferencesへ入れる。\\n"''')

          replace_once(prompts,
              '''\t\t"- 各追加Taskは実行するTool名とargumentsを具体的に指定する。\\n"
\t\t"- 修正後要求を満たすために必要なEvidenceを再取得できるTaskを最大2件提案する。",''',
              '''\t\t"- 各追加Taskは実行するTool名とargumentsを具体的に指定する。\\n"
\t\t"- argumentsはTool一覧のargumentSchemaにある正式フィールド名だけを使う。\\n"
\t\t"- 修正後要求を満たすために必要なEvidenceを再取得できるTaskを最大2件提案する。",''')

          test = r'''#include <cassert>
          #include <iostream>
          #include <memory>

          #include "AgentOS/Core/Logic/ComponentQueryRouting.h"
          #include "AgentOS/Core/Command/CapabilitySet.h"
          #include "AgentOS/Core/Command/CommandPipeline.h"

          using namespace agentos;

          namespace {

          class FakeReadComponentTool : public ICommandExecutor {
          public:
              FakeReadComponentTool() {
                  descriptor_.name = "ReadComponent";
                  descriptor_.description = "test";
                  descriptor_.requiredPermission = PermissionLevel::Read;
                  descriptor_.argumentSchema = Json::object({
                      {"entityName", Json::object({{"type", "string"}, {"required", true}})},
                      {"component", Json::object({{"type", "string"}, {"required", true}})},
                  });
              }
              const ToolDescriptor& Descriptor() const override { return descriptor_; }
              Result CheckPrecondition(const Json&) override { return Result::Ok(); }
              CommandResult Execute(const Json& arguments) override {
                  return CommandResult::Ok(arguments);
              }
          private:
              ToolDescriptor descriptor_;
          };

          void TestRoutes() {
              {
                  const auto route = componentquery::Resolve("Fieldになんのコンポーネントがあるの？");
                  assert(route.tool == "DescribeEntity");
                  assert(route.arguments.at("entityName") == "Field");
              }
              {
                  const auto route = componentquery::Resolve("Entity 'Light' にも？");
                  assert(route.tool == "DescribeEntity");
                  assert(route.arguments.at("entityName") == "Light");
              }
              {
                  const auto route = componentquery::Resolve("LightComponentの設定を教えて");
                  assert(route.tool == "ReadComponent");
                  assert(route.arguments.at("entityName") == "Light");
                  assert(route.arguments.at("component") == "LightComponent");
              }
              {
                  const auto route = componentquery::Resolve("ライトコンポーネントとかもない状態？");
                  assert(route.tool == "ReadComponent");
                  assert(route.arguments.at("entityName") == "Light");
                  assert(route.arguments.at("component") == "LightComponent");
              }
              {
                  const auto route = componentquery::Resolve("今のシーンの状況を教えて");
                  assert(route.tool == "ListEntities");
              }
          }

          void TestDeterministicReplies() {
              componentquery::Route route{
                  "DescribeEntity",
                  Json::object({{"entityName", "Field"}}),
              };
              Json payload = Json::object({
                  {"components", Json::array({
                      Json::object({{"component", "NameComponent"}}),
                      Json::object({{"component", "TransformComponent"}}),
                  })},
              });
              const std::string reply = componentquery::BuildReply(route, payload);
              assert(reply.find("2件") != std::string::npos);
              assert(reply.find("NameComponent") != std::string::npos);
              assert(reply.find("登録されていない") == std::string::npos);

              route = componentquery::Route{
                  "ReadComponent",
                  Json::object({{"entityName", "Light"}, {"component", "LightComponent"}}),
              };
              payload = Json::object({
                  {"component", "LightComponent"},
                  {"value", Json::object({{"Enable", 1}, {"CastShadow", 1}})},
              });
              const std::string valueReply = componentquery::BuildReply(route, payload);
              assert(valueReply.find("Enable") != std::string::npos);
              assert(valueReply.find("CastShadow") != std::string::npos);
              assert(componentquery::PayloadSatisfied(payload));
              assert(!componentquery::PayloadSatisfied(Json::object({{"error", "missing"}})));
          }

          void TestRepairArgumentAliases() {
              CapabilityRegistry registry;
              CommandPipeline pipeline(&registry);
              pipeline.RegisterTool(std::make_shared<FakeReadComponentTool>());
              CapabilityToken token = registry.IssueToken(
                  "RepairWorker", {"ReadComponent"}, PermissionLevel::Read);

              CommandRequest request;
              request.issuer = "RepairWorker";
              request.tool = "ReadComponent";
              request.arguments = Json::object({
                  {"entityId", "Light"},
                  {"componentName", "LightComponent"},
              });
              request.capability = token;

              const CommandResult result = pipeline.Submit(request);
              assert(result.IsOk());
              assert(result.payload.at("entityName") == "Light");
              assert(result.payload.at("component") == "LightComponent");
              assert(!result.payload.contains("entityId"));
              assert(!result.payload.contains("componentName"));
          }

          } // namespace

          int main() {
              TestRoutes();
              TestDeterministicReplies();
              TestRepairArgumentAliases();
              std::cout << "AgentOSComponentQueryRoutingSmokeTest: PASS\n";
              return 0;
          }
          '''
          Path('Tests/AgentOSComponentQueryRoutingSmokeTest.cpp').write_text(
              '\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines()) + '\n',
              encoding='utf-8')

          makefile = 'Tests/AgentOS/Makefile'
          replace_once(makefile,
              '''        AgentOSSceneSnapshotFastPathSmokeTest \\
        AgentOSVerticalSliceSmokeTest''',
              '''        AgentOSSceneSnapshotFastPathSmokeTest \\
        AgentOSComponentQueryRoutingSmokeTest \\
        AgentOSVerticalSliceSmokeTest''')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/GameApplication/AgentOS/Core/Logic/ComponentQueryRouting.h \
                  Source/GameApplication/AgentOS/Core/Command/CommandPipeline.cpp \
                  Source/GameApplication/AgentOS/Core/Llm/PromptTemplates.cpp \
                  Source/GameApplication/AgentOS/Service/AgentOSService.cpp \
                  Tests/AgentOSComponentQueryRoutingSmokeTest.cpp \
                  Tests/AgentOS/Makefile
          git commit -m "Fix AgentOS component query grounding"
          git push origin HEAD:llm-agent
