name: MiniGame Collection Validation

on:
  pull_request:
    branches:
      - master
      - refactor/ecs-scheduler-foundation
    paths:
      - "Source/GameApplication/Game/MiniGameCollection/**"
      - "Source/GameApplication/Engine/Scene/Component/audioComponent.h"
      - "Source/GameApplication/Engine/Scene/Component/componentList.h"
      - "Source/GameApplication/Engine/Scene/System/Audio/audioSystem.h"
      - "Source/GameApplication/Engine/Scene/sceneManager.h"
      - "Source/GameApplication/Engine/Scene/sceneManager.cpp"
      - "Source/GameApplication/Engine/engine.cpp"
      - "Source/GameApplication/Service/Graphics/D2DRenderer.h"
      - "Source/GameApplication/Service/Graphics/D2DRenderer.cpp"
      - "Source/GameApplication/Service/Graphics/mainRenderer.h"
      - "Source/GameApplication/Service/Graphics/mainRenderer.cpp"
      - "Source/GameApplication/gameApplication.cpp"
      - "Asset/Game/MiniGameCollection/**"
      - "Tests/MiniGameCollectionCoreSmokeTest.cpp"
      - "Tests/MiniGamePresentationSpikeSmokeTest.cpp"
      - "Tests/MiniGameRulesSmokeTest.cpp"
      - "Directory.Build.targets"
      - "GameEngine.vcxproj"
      - "GameEngine.sln"
      - ".github/workflows/minigame-collection-core.yml"
  push:
    branches:
      - game/minigame-collection
    paths:
      - "Source/GameApplication/Game/MiniGameCollection/**"
      - "Source/GameApplication/Engine/Scene/Component/audioComponent.h"
      - "Source/GameApplication/Engine/Scene/Component/componentList.h"
      - "Source/GameApplication/Engine/Scene/System/Audio/audioSystem.h"
      - "Source/GameApplication/Engine/Scene/sceneManager.h"
      - "Source/GameApplication/Engine/Scene/sceneManager.cpp"
      - "Source/GameApplication/Engine/engine.cpp"
      - "Source/GameApplication/Service/Graphics/D2DRenderer.h"
      - "Source/GameApplication/Service/Graphics/D2DRenderer.cpp"
      - "Source/GameApplication/Service/Graphics/mainRenderer.h"
      - "Source/GameApplication/Service/Graphics/mainRenderer.cpp"
      - "Source/GameApplication/gameApplication.cpp"
      - "Asset/Game/MiniGameCollection/**"
      - "Tests/MiniGameCollectionCoreSmokeTest.cpp"
      - "Tests/MiniGamePresentationSpikeSmokeTest.cpp"
      - "Tests/MiniGameRulesSmokeTest.cpp"
      - "Directory.Build.targets"
      - "GameEngine.vcxproj"
      - "GameEngine.sln"
      - ".github/workflows/minigame-collection-core.yml"
  workflow_dispatch:

concurrency:
  group: minigame-collection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Enforce runtime UI boundary
        shell: bash
        run: |
          files=(
            Source/GameApplication/Game/MiniGameCollection/Runtime/MiniGameCollectionEntryRuntime.h
            Source/GameApplication/Game/MiniGameCollection/Runtime/MiniGamePersistentRuntime.h
            Source/GameApplication/Game/MiniGameCollection/Runtime/PresentationSpikeRuntime.h
            Source/GameApplication/Game/MiniGameCollection/Runtime/ColorTerritoryRuntime.h
            Source/GameApplication/Game/MiniGameCollection/Runtime/SheepRoundupRuntime.h
            Source/GameApplication/Game/MiniGameCollection/Runtime/MiniGameRuntimeUi.h
          )
          if grep -n "ImGui::" "${files[@]}"; then
            echo "Gameplay UI must use MiniGameRuntimeUi / Direct2D, not ImGui."
            exit 1
          fi
          test "$(grep -c "ImGui::" Source/GameApplication/Game/MiniGameCollection/Runtime/MiniGameRuntimeScriptBase.h)" -eq 1
          grep -q "void inspector" Source/GameApplication/Game/MiniGameCollection/Runtime/MiniGameRuntimeScriptBase.h
          grep -q "void DrawHitDebug" Source/GameApplication/Game/MiniGameCollection/Runtime/BackshotRuntime.h
      - name: Enforce scene-driven entry flow
        shell: bash
        run: |
          if grep -n "MiniGameCollection" Source/GameApplication/gameApplication.cpp; then
            echo "GameApplication must remain independent from the mini-game entry scene."
            exit 1
          fi
          grep -q "MiniGameCollectionEntryRuntime" Source/GameApplication/Engine/Scene/Component/componentList.h
          grep -q "QueueAdditiveSceneLoadFromFilePath" Source/GameApplication/Game/MiniGameCollection/Runtime/MiniGameCollectionEntryRuntime.h
          grep -q "MiniGamePersistent.scene" Source/GameApplication/Game/MiniGameCollection/Runtime/MiniGameCollectionEntryRuntime.h
      - name: Enforce deferred additive scene loading
        shell: bash
        run: |
          runtime_files=(
            Source/GameApplication/Game/MiniGameCollection/Runtime/MiniGameCollectionEntryRuntime.h
            Source/GameApplication/Game/MiniGameCollection/Runtime/MiniGamePersistentRuntime.h
            Source/GameApplication/Game/MiniGameCollection/Core/MiniGameSceneTransitionEngineBackend.h
          )
          if grep -nE '(^|[^A-Za-z0-9_])LoadFromFilePath[[:space:]]*\(' "${runtime_files[@]}"; then
            echo "Mini-game runtime must queue additive scene loads outside ECS schedule execution."
            exit 1
          fi
          grep -q "QueueAdditiveSceneLoadFromFilePath" Source/GameApplication/Engine/Scene/sceneManager.h
          grep -q "ProcessQueuedAdditiveSceneLoads" Source/GameApplication/Engine/engine.cpp
          grep -q "QueueAdditiveSceneLoadFromFilePath" Source/GameApplication/Game/MiniGameCollection/Runtime/MiniGamePersistentRuntime.h
          grep -q "QueueAdditiveSceneLoadFromFilePath" Source/GameApplication/Game/MiniGameCollection/Core/MiniGameSceneTransitionEngineBackend.h
      - name: Compile and run minigame model contracts
        shell: bash
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I Source -I Source/GameApplication \
            Tests/MiniGameCollectionCoreSmokeTest.cpp \
            -o minigame-collection-core-test
          ./minigame-collection-core-test
      - name: Compile and run presentation retry contract
        shell: bash
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I Source -I Source/GameApplication \
            Tests/MiniGamePresentationSpikeSmokeTest.cpp \
            -o minigame-presentation-spike-test
          ./minigame-presentation-spike-test
      - name: Compile and run minigame rule flow
        shell: bash
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I Source -I Source/GameApplication \
            Tests/MiniGameRulesSmokeTest.cpp \
            -o minigame-rules-test
          ./minigame-rules-test
      - name: Validate required scene assets
        shell: pwsh
        run: |
          $required = @(
            'Asset/Game/MiniGameCollection/Scene/Entry/MiniGameCollectionEntry.scene',
            'Asset/Game/MiniGameCollection/Scene/Persistent/MiniGamePersistent.scene',
            'Asset/Game/MiniGameCollection/Scene/PresentationTest/PresentationSpike.scene',
            'Asset/Game/MiniGameCollection/Scene/ColorTerritory/ColorTerritory.scene',
            'Asset/Game/MiniGameCollection/Scene/SheepRoundup/SheepRoundup.scene',
            'Asset/Game/MiniGameCollection/Scene/Backshot/Backshot.scene'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required minigame scene: $path"
            }
            $content = Get-Content -Raw $path
            if ($content -notmatch 'SceneSettings:' -or $content -notmatch 'Entities:') {
              throw "Invalid minigame scene YAML structure: $path"
            }
          }

  full-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - name: Build Debug x64 solution
        shell: pwsh
        run: |
          msbuild GameEngine.sln /m /restore /p:Configuration=Debug /p:Platform=x64 /p:RunCodeAnalysis=false
