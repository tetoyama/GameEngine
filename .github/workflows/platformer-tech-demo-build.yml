name: Platformer Tech Demo Build

on:
  push:
    branches:
      - game/platformer-tech-demo
  pull_request:
    branches:
      - refactor/ecs-scheduler-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: platformer-stomp-hotfix-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  apply-stomp-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: game/platformer-tech-demo
          fetch-depth: 0

      - name: Patch boss and normal enemy stomp accessibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          boss_path = Path('Source/GameApplication/Game/Platformer/PlatformerBoss.h')
          boss = boss_path.read_text(encoding='utf-8')

          boss_replacements = [
              (
                  'REFLECT_FIELD(float, stompHeightMargin, 0.75f)',
                  'REFLECT_FIELD(float, stompHeightMargin, 0.10f)'
              ),
              (
                  '\t\taudio = GetComponentRef<AudioComponent>();\n\t\tplayer = PlatformerSceneAccess::FindFirst<PlatformerCharacterController>(m_ref.GetScene());',
                  '\t\taudio = GetComponentRef<AudioComponent>();\n'
                  '\t\tConfigureStompableBody();\n'
                  '\t\tplayer = PlatformerSceneAccess::FindFirst<PlatformerCharacterController>(m_ref.GetScene());'
              ),
              (
                  '\t\tif(!bossPose || !playerController || !playerPose) return;\n\n\t\tswitch(state) {',
                  '\t\tif(!bossPose || !playerController || !playerPose) return;\n\n'
                  '\t\t// Resolve the generous weak-point volume before the broad body collider.\n'
                  '\t\t// A fully-held first jump reaches this height without requiring a chain.\n'
                  '\t\tif(state == State::Stunned &&\n'
                  '\t\t   TryReceiveAccessibleStomp(*playerController, *playerPose, *bossPose)) {\n'
                  '\t\t\treturn;\n'
                  '\t\t}\n\n'
                  '\t\tswitch(state) {'
              ),
              (
                  '\tvoid ValidatePresentationSettings() {\n\t\teffectCenterHeight = (std::max)(0.0f, effectCenterHeight);',
                  '\tvoid ValidatePresentationSettings() {\n'
                  '\t\t// Existing scenes store 0.75, which placed the weak point above the\n'
                  '\t\t// ordinary first-jump arc. Keep it near the compressed upper body.\n'
                  '\t\tstompHeightMargin = std::clamp(stompHeightMargin, 0.05f, 0.15f);\n'
                  '\t\teffectCenterHeight = (std::max)(0.0f, effectCenterHeight);'
              ),
              (
                  '\tbool HandlePlayerContact(const EntityRef& other) {',
                  '\tvoid ConfigureStompableBody() {\n'
                  '\t\tauto* pose = transform.TryGet();\n'
                  '\t\tauto* col = collider.TryGet();\n'
                  '\t\tif(!pose || !col || col->colliders.empty()) return;\n\n'
                  '\t\tColliderShape& shape = col->colliders.front();\n'
                  '\t\tif(shape.type != ColliderType::Box) return;\n\n'
                  '\t\tconst float shapeHeight = (std::max)(0.001f, shape.size.y);\n'
                  '\t\tconst float oldScaleY = (std::max)(0.001f, std::abs(pose->scale.y));\n'
                  '\t\tconst float oldWorldHeight = shapeHeight * oldScaleY;\n'
                  '\t\tconst float targetWorldHeight = (std::min)(oldWorldHeight, 1.65f);\n'
                  '\t\tif(targetWorldHeight >= oldWorldHeight - 0.01f) return;\n\n'
                  '\t\tconst float oldCenterY = pose->position.y + shape.offset.y * oldScaleY;\n'
                  '\t\tconst float bottomY = oldCenterY - oldWorldHeight * 0.5f;\n'
                  '\t\tpose->scale.y = targetWorldHeight / shapeHeight;\n'
                  '\t\tconst float newCenterY = bottomY + targetWorldHeight * 0.5f;\n'
                  '\t\tpose->position.y = newCenterY - shape.offset.y * pose->scale.y;\n'
                  '\t\tcol->needsUpdate = true;\n'
                  '\t}\n\n'
                  '\tbool TryReceiveAccessibleStomp(\n'
                  '\t\tPlatformerCharacterController& playerController,\n'
                  '\t\tconst TransformComponent& playerPose,\n'
                  '\t\tconst TransformComponent& bossPose\n'
                  '\t) {\n'
                  '\t\tif(state != State::Stunned || health <= 0) return false;\n'
                  '\t\tif(playerController.GetVerticalVelocity() > 0.65f) return false;\n\n'
                  '\t\tconst float dx = playerPose.position.x - bossPose.position.x;\n'
                  '\t\tconst float dz = playerPose.position.z - bossPose.position.z;\n'
                  '\t\tconst float horizontalDistance = std::sqrt(dx * dx + dz * dz);\n'
                  '\t\tconst float halfWidth = (std::max)(baseScale.x, baseScale.z) * 0.5f;\n'
                  '\t\tconst float catchRadius = (std::max)(1.15f, halfWidth + 0.35f);\n'
                  '\t\tconst float minimumFootY = bossPose.position.y + stompHeightMargin;\n'
                  '\t\tconst float maximumFootY = bossPose.position.y + 1.55f;\n\n'
                  '\t\tif(horizontalDistance > catchRadius ||\n'
                  '\t\t   playerPose.position.y < minimumFootY ||\n'
                  '\t\t   playerPose.position.y > maximumFootY) {\n'
                  '\t\t\treturn false;\n'
                  '\t\t}\n\n'
                  '\t\tReceiveStomp(playerController, bossPose.position);\n'
                  '\t\treturn true;\n'
                  '\t}\n\n'
                  '\tbool HandlePlayerContact(const EntityRef& other) {'
              ),
              (
                  '\t\tconst bool aboveWeakPoint =\n\t\t\tplayerPose->position.y >= bossPose->position.y + stompHeightMargin;\n\t\tif(state == State::Stunned && playerController->IsDescending() && aboveWeakPoint) {\n\t\t\tReceiveStomp(*playerController, bossPose->position);\n\t\t\treturn true;\n\t\t}',
                  '\t\tif(TryReceiveAccessibleStomp(*playerController, *playerPose, *bossPose)) {\n'
                  '\t\t\treturn true;\n'
                  '\t\t}'
              ),
              (
                  'baseScale.y * (0.52f + wobble * 0.07f)',
                  'baseScale.y * (0.36f + wobble * 0.06f)'
              )
          ]

          for old, new in boss_replacements:
              if old not in boss:
                  raise SystemExit(f'boss fragment not found: {old[:100]!r}')
              boss = boss.replace(old, new, 1)
          boss_path.write_text(boss, encoding='utf-8')

          enemy_path = Path('Source/GameApplication/Game/Platformer/PlatformerEnemy.h')
          enemy = enemy_path.read_text(encoding='utf-8')
          enemy_replacements = [
              (
                  'REFLECT_FIELD(float, stompHeightMargin, 0.35f)',
                  'REFLECT_FIELD(float, stompHeightMargin, 0.12f)'
              ),
              (
                  '\tbool decode(SceneContext* context, const YAML::Node& node) override {\n\t\tDECODE_FIELDS(node);\n\t\treturn true;\n\t}',
                  '\tbool decode(SceneContext* context, const YAML::Node& node) override {\n'
                  '\t\tDECODE_FIELDS(node);\n'
                  '\t\t// Clamp old 0.35 scene data to a beginner-friendly upper-contact band.\n'
                  '\t\tstompHeightMargin = std::clamp(stompHeightMargin, 0.08f, 0.18f);\n'
                  '\t\treturn true;\n'
                  '\t}'
              ),
              (
                  '\t\tconst float stompReferenceY = enemyTransform->position.y - visualCenterLift;\n\t\tconst bool above = playerPose->position.y >= stompReferenceY + stompHeightMargin;\n\t\tif(controller->IsDescending() && above) {\n\t\t\tDefeat(*controller, enemyTransform->position);\n\t\t\treturn;\n\t\t}',
                  '\t\tconst float stompReferenceY = enemyTransform->position.y - visualCenterLift;\n'
                  '\t\tconst float verticalVelocity = controller->GetVerticalVelocity();\n'
                  '\t\tconst bool descendingOrNearApex = verticalVelocity <= 0.65f;\n'
                  '\t\tconst bool above =\n'
                  '\t\t\tplayerPose->position.y >= stompReferenceY + stompHeightMargin;\n'
                  '\t\tconst float dx = playerPose->position.x - enemyTransform->position.x;\n'
                  '\t\tconst float dz = playerPose->position.z - enemyTransform->position.z;\n'
                  '\t\tconst float horizontalDistance = std::sqrt(dx * dx + dz * dz);\n'
                  '\t\tconst float catchRadius = (std::max)(\n'
                  '\t\t\t0.72f, (std::max)(baseScale.x, baseScale.z) * 0.72f);\n'
                  '\t\tif(descendingOrNearApex && above && horizontalDistance <= catchRadius) {\n'
                  '\t\t\tDefeat(*controller, enemyTransform->position);\n'
                  '\t\t\treturn;\n'
                  '\t\t}'
              )
          ]

          for old, new in enemy_replacements:
              if old not in enemy:
                  raise SystemExit(f'enemy fragment not found: {old[:100]!r}')
              enemy = enemy.replace(old, new, 1)
          enemy_path.write_text(enemy, encoding='utf-8')

          # Restore the normal build workflow and remove the temporary helper.
          Path('.github/workflows/platformer-tech-demo-build.yml').write_text('''name: Platformer Tech Demo Build

on:
  push:
    branches:
      - game/platformer-tech-demo
  pull_request:
    branches:
      - refactor/ecs-scheduler-foundation
  workflow_dispatch:

concurrency:
  group: platformer-tech-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-x64:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Debug x64
        shell: pwsh
        run: >-
          msbuild GameEngine.sln
          /m
          /restore
          /t:Build
          /p:Configuration=Debug
          /p:Platform=x64
          /p:UseSharedCompilation=false
          /verbosity:minimal
''', encoding='utf-8')
          helper = Path('.github/workflows/platformer-boss-stomp-hotfix.yml')
          if helper.exists():
              helper.unlink()
          PY

      - name: Commit accessible stomp tuning
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Source/GameApplication/Game/Platformer/PlatformerBoss.h Source/GameApplication/Game/Platformer/PlatformerEnemy.h .github/workflows
          git commit -m "Make enemy stomps beginner friendly"
          git push origin HEAD:game/platformer-tech-demo
