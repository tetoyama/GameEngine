name: Platformer Tech Demo Build

on:
  push:
    branches:
      - game/platformer-tech-demo
  pull_request:
    branches:
      - refactor/ecs-scheduler-foundation
  workflow_dispatch:

concurrency:
  group: platformer-tech-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-boss-stomp:
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[boss-stomp-fix]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct boss stomp geometry and restore workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Source/GameApplication/Game/Platformer/PlatformerGameManager.h')
          text = path.read_text(encoding='utf-8')
          old = '''\t\t\tconst float targetWorldHeight = (std::min)(oldWorldHeight, 1.15f);
\t\t\tconst float oldCenterY = pose->position.y + shape.offset.y * oldScaleY;
\t\t\tconst float bottomY = oldCenterY - oldWorldHeight * 0.5f;

\t\t\tif(targetWorldHeight < oldWorldHeight - 0.01f) {
\t\t\t\tpose->scale.y = targetWorldHeight / shapeHeight;
\t\t\t\tconst float newCenterY = bottomY + targetWorldHeight * 0.5f;
\t\t\t\tpose->position.y = newCenterY - shape.offset.y * pose->scale.y;
\t\t\t\tcol->needsUpdate = true;
\t\t\t}
'''
          new = '''\t\t\tconst float targetWorldHeight = (std::min)(oldWorldHeight, 1.50f);
\t\t\tconst float oldCenterY = pose->position.y + shape.offset.y * oldScaleY;
\t\t\tconst float bottomY = oldCenterY - oldWorldHeight * 0.5f;

\t\t\tif(targetWorldHeight < oldWorldHeight - 0.01f) {
\t\t\t\tpose->scale.y = targetWorldHeight / shapeHeight;
\t\t\t\t// Keep the physical bottom on the floor, but lower the rendered origin
\t\t\t\t// slightly below the box centre. The existing +0.75 weak-point rule then
\t\t\t\t// lies 14 cm below the physical top instead of above it, giving a broad
\t\t\t\t// beginner-friendly stomp band that a held first jump can reach.
\t\t\t\tconst float weakPointInset = (std::min)(0.14f, targetWorldHeight * 0.18f);
\t\t\t\tshape.offset.y = weakPointInset / pose->scale.y;
\t\t\t\tconst float newCenterY = bottomY + targetWorldHeight * 0.5f;
\t\t\t\tpose->position.y = newCenterY - weakPointInset;
\t\t\t\tcol->needsUpdate = true;
\t\t\t}
'''
          if old not in text:
              raise SystemExit('boss stomp geometry block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cat > .github/workflows/platformer-tech-demo-build.yml <<'YAML'
          name: Platformer Tech Demo Build

          on:
            push:
              branches:
                - game/platformer-tech-demo
            pull_request:
              branches:
                - refactor/ecs-scheduler-foundation
            workflow_dispatch:

          concurrency:
            group: platformer-tech-demo-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            build-debug-x64:
              runs-on: windows-2022
              timeout-minutes: 45

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Configure MSBuild
                  uses: microsoft/setup-msbuild@v2

                - name: Build Debug x64
                  shell: pwsh
                  run: >-
                    msbuild GameEngine.sln
                    /m
                    /restore
                    /t:Build
                    /p:Configuration=Debug
                    /p:Platform=x64
                    /p:UseSharedCompilation=false
                    /verbosity:minimal
          YAML

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/GameApplication/Game/Platformer/PlatformerGameManager.h .github/workflows/platformer-tech-demo-build.yml
          git commit -m "Fix boss stomp weak point [boss-stomp-fix]"
          git push origin HEAD:game/platformer-tech-demo

  build-debug-x64:
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[boss-stomp-fix]') }}
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Debug x64
        shell: pwsh
        run: >-
          msbuild GameEngine.sln
          /m
          /restore
          /t:Build
          /p:Configuration=Debug
          /p:Platform=x64
          /p:UseSharedCompilation=false
          /verbosity:minimal
