std::string ValidationFailureSourceType(const std::string& error) {
\tif (error.find("tool is not allowed") != std::string::npos) return "ToolAllowlistRejected";
\tif (error.find("dependency evidence") != std::string::npos ||
\t    error.find("ungrounded placeholder") != std::string::npos) {
\t\treturn "GroundingRejected";
\t}
\treturn "CommandValidationError";
}

std::string CommandFailureSourceType(CommandStatus status) {
\tswitch (status) {
\tcase CommandStatus::SchemaRejected: return "SchemaRejected";
\tcase CommandStatus::CapabilityRejected: return "CapabilityRejected";
\tcase CommandStatus::BudgetRejected: return "BudgetRejected";
\tcase CommandStatus::PreconditionRejected: return "PreconditionRejected";
\tcase CommandStatus::ExecutionFailed: return "ExecutionFailed";
\tcase CommandStatus::PostconditionFailed: return "PostconditionFailed";
\tcase CommandStatus::AwaitingApproval: return "AwaitingApproval";
\tcase CommandStatus::Ok: return "ToolResultError";
\t}
\treturn "ExecutionFailed";
}

Result ValidateGroundedCommand(
\tconst Json& command,
