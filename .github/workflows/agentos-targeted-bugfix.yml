name: Apply AgentOS evidence and ambiguity fixes

on:
  push:
    branches:
      - llm-agent
    paths:
      - .github/workflows/agentos-targeted-bugfix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: llm-agent
          fetch-depth: 0

      - name: Apply targeted fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, got {count}\n--- old ---\n{old}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          intake = "Source/GameApplication/AgentOS/Core/Agents/IntakeAgent.cpp"
          replace_once(
              intake,
              '''\tif (value == "new" || value == "continue" || value == "correct" ||
\t    value == "clarify" || value == "refer") {
''',
              '''\tif (value == "new" || value == "continue" || value == "correct" ||
\t    value == "clarify" || value == "refer" || value == "refresh") {
''')

          replace_once(
              intake,
              '''bool IsSimpleConversationInput(const std::string& userRequest) {
\tif (userRequest.empty() || userRequest.size() > 96) return false;
\tconst bool greeting = ContainsAny(userRequest, {
\t\t"こんにちは", "こんばんは", "おはよう", "はじめまして", "ありがとう", "よろしく",
\t\t"Hello", "hello", "Hi", "hi"
\t});
\tconst bool engineRequest = ContainsAny(userRequest, {
\t\t"Entity", "Component", "System", "シーン", "コード", "調査", "確認", "一覧", "修正"
\t});
\treturn greeting && !engineRequest;
}
''',
              '''bool IsSimpleConversationInput(const std::string& userRequest) {
\tif (userRequest.empty() || userRequest.size() > 96) return false;
\tconst bool greeting = ContainsAny(userRequest, {
\t\t"こんにちは", "こんばんは", "おはよう", "はじめまして", "ありがとう", "よろしく",
\t\t"Hello", "hello", "Hi", "hi"
\t});
\tconst bool engineRequest = ContainsAny(userRequest, {
\t\t"Entity", "Component", "System", "シーン", "コード", "調査", "確認", "一覧", "修正"
\t});
\treturn greeting && !engineRequest;
}

bool IsFreshRuntimeRequest(const std::string& userRequest) {
\treturn ContainsAny(userRequest, {
\t\t"今のシーン", "現在のシーン", "最新のシーン", "今の状態", "現在の状態",
\t\t"今いるEntity", "現在のEntity", "シーンの状況", "runtime state", "current scene"
\t});
}

bool IsExplicitCorrection(const std::string& userRequest) {
\treturn ContainsAny(userRequest, {
\t\t"違う", "そうじゃなくて", "ではなく", "じゃなく", "正しくは", "訂正",
\t\t"あるはず", "のはず"
\t});
}
''')

          replace_once(
              intake,
              '''\t// newは履歴を保存したまま生成Contextから隔離する。
\tif (relation == "new") {
\t\tselected["selectionPolicy"] = "active_turn_only";
\t\treturn selected;
