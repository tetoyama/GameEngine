bool EvidenceLooksFailed(const Json& evidence) {
\tif (!evidence.is_object()) return true;
\tconst Json payload = evidence.value("payload", Json::object());
\treturn payload.is_object() &&
\t\t(payload.value("failure", false) || payload.value("unsatisfied", false));
}

std::string SuccessfulEvidenceText(const Json& builtEvidence) {
\tstd::string text;
\tif (!builtEvidence.is_object() || !builtEvidence.contains("evidences") ||
\t    !builtEvidence.at("evidences").is_array()) return text;
\tfor (const Json& evidence : builtEvidence.at("evidences")) {
\t\tif (EvidenceLooksFailed(evidence)) continue;
\t\ttext += evidence.value("claim", std::string());
\t\ttext += "\\n";
\t\tif (evidence.contains("payload")) text += evidence.at("payload").dump();
\t\ttext += "\\n";
\t}
\treturn text;
}

std::unordered_set<long long> AuthoritativeEntityCounts(const Json& builtEvidence) {
\tstd::unordered_set<long long> counts;
\tif (!builtEvidence.is_object() || !builtEvidence.contains("evidences") ||
\t    !builtEvidence.at("evidences").is_array()) return counts;
\tfor (const Json& evidence : builtEvidence.at("evidences")) {
\t\tif (EvidenceLooksFailed(evidence) || !evidence.contains("provenance") ||
\t\t    !evidence.at("provenance").is_object() ||
\t\t    evidence.at("provenance").value("sourceType", std::string()) != "Tool:ListEntities") {
\t\t\tcontinue;
\t\t}
\t\tconst Json payload = evidence.value("payload", Json::object());
\t\tfor (const char* key : {"count", "entityCount", "total"}) {
\t\t\tif (payload.contains(key) && payload.at(key).is_number_integer()) {
\t\t\t\tcounts.insert(payload.at(key).get<long long>());
\t\t\t}
\t\t}
\t\tif (payload.contains("entities") && payload.at("entities").is_array()) {
\t\t\tcounts.insert(static_cast<long long>(payload.at("entities").size()));
\t\t}
\t}
\treturn counts;
}

bool EntityCountClaimsAreSupported(const std::string& report, const Json& builtEvidence) {
\tconst std::unordered_set<long long> counts = AuthoritativeEntityCounts(builtEvidence);
\tif (counts.empty()) return true;
\tstatic const std::regex countClaim(
\t\tR"(([0-9]+)\\s*(?:件|個|体|つ|Entities|Entity|エンティティ))");
\tfor (auto it = std::sregex_iterator(report.begin(), report.end(), countClaim);
\t     it != std::sregex_iterator(); ++it) {
\t\tconst long long value = std::stoll((*it)[1].str());
\t\tif (counts.count(value) == 0) return false;
\t}
\treturn true;
}

bool HasCapabilityFailureEvidence(const Json& builtEvidence) {
\tif (!builtEvidence.is_object() || !builtEvidence.contains("evidences") ||
\t    !builtEvidence.at("evidences").is_array()) return false;
\tfor (const Json& evidence : builtEvidence.at("evidences")) {
\t\tif (!evidence.is_object() || !evidence.contains("provenance") ||
\t\t    !evidence.at("provenance").is_object()) continue;
\t\tconst std::string sourceType =
\t\t\tevidence.at("provenance").value("sourceType", std::string());
\t\tif (sourceType == "CapabilityRejected" || sourceType == "AwaitingApproval") return true;
\t}
\treturn false;
}

bool CapabilityClaimsAreSupported(const std::string& report, const Json& builtEvidence) {
\tconst bool claimsCapabilityFailure = ContainsAny(report, {
\t\t"権限不足", "権限がない", "許可されていない", "利用禁止",
\t\t"permission denied", "access denied"
\t});
\treturn !claimsCapabilityFailure || HasCapabilityFailureEvidence(builtEvidence);
}

bool IsGenericHistoryIdentifier(const std::string& value) {
\tstatic const std::unordered_set<std::string> generic = {
\t\t"entity", "component", "system", "scene", "runtime", "current", "report",
\t\t"agentos", "tool", "listentities", "listsystems", "describeentity",
\t};
\tstd::string lower = value;
\tstd::transform(lower.begin(), lower.end(), lower.begin(), [](unsigned char ch) {
\t\treturn static_cast<char>(std::tolower(ch));
\t});
\treturn generic.count(lower) != 0;
}

bool ContainsAsciiToken(const std::string& text, const std::string& token) {
\tstd::size_t pos = 0;
\twhile ((pos = text.find(token, pos)) != std::string::npos) {
\t\tauto word = [](unsigned char ch) { return std::isalnum(ch) != 0 || ch == '_'; };
\t\tconst bool left = pos == 0 || !word(static_cast<unsigned char>(text[pos - 1]));
\t\tconst std::size_t end = pos + token.size();
\t\tconst bool right = end >= text.size() || !word(static_cast<unsigned char>(text[end]));
\t\tif (left && right) return true;
\t\tpos = end;
\t}
\treturn false;
}

bool HistoryClaimsAreSupported(const std::string& report, const Json& builtEvidence) {
\tconst std::string relation = prompts::CurrentTurnRelation();
\tif (relation != "new" && relation != "refresh") return true;
\tconst std::string evidenceText = SuccessfulEvidenceText(builtEvidence);
\tconst Json identifiers = prompts::CurrentHistoryIdentifiers();
\tif (!identifiers.is_array()) return true;
\tfor (const Json& value : identifiers) {
\t\tif (!value.is_string()) continue;
\t\tconst std::string identifier = value.get<std::string>();
\t\tif (identifier.size() < 4 || identifier.find_first_of(":/.-") != std::string::npos ||
\t\t    IsGenericHistoryIdentifier(identifier)) continue;
\t\tif (evidenceText.find(identifier) == std::string::npos &&
\t\t    ContainsAsciiToken(report, identifier)) return false;
\t}
\treturn true;
}

bool ReportIsEvidenceConsistent(const std::string& report, const Json& builtEvidence) {
\treturn EntityCountClaimsAreSupported(report, builtEvidence) &&
