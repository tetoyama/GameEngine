name: Windows Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      BUILD_CONFIGURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.configuration || 'Debug' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          show-progress: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        shell: pwsh
        run: |
          msbuild GameEngine.sln /m /restore /t:Build `
            /p:Configuration="$env:BUILD_CONFIGURATION" `
            /p:Platform=x64 `
            /p:UseSharedCompilation=false `
            /p:RunCodeAnalysis=false `
            /verbosity:minimal
