name: Windows Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release
      portable_gpu:
        description: Run portable GPU validation on the macOS runner
        required: false
        default: false
        type: boolean
      target_platform:
        description: Package target (uses a native runner for each OS)
        required: false
        default: all
        type: choice
        options: [all, Windows, macOS, Linux]

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-build:
    name: Portable runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '["windows-2022","macos-14","ubuntu-24.04"]' || inputs.target_platform == 'Windows' && '["windows-2022"]' || inputs.target_platform == 'macOS' && '["macos-14"]' || inputs.target_platform == 'Linux' && '["ubuntu-24.04"]' || '["windows-2022","macos-14","ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev libasound2-dev
      - name: Build, test and package selected native target
        run: cmake -DTARGET_PLATFORM=${{ runner.os }} -P cmake/BuildPortable.cmake
      - name: Validate Metal renderer
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.portable_gpu
        run: |
          ./portable-runtime/macOS/Release/bin/GameEnginePortable --backend metal --validate --offscreen --width 480 --height 320 --capture portable-runtime/macOS/Release/metal.ppm
          ./portable-runtime/macOS/Release/bin/GameEnginePortable --backend metal --validate --width 480 --height 320 --capture portable-runtime/macOS/Release/metal-window.ppm
          cmp portable-runtime/macOS/Release/metal.ppm portable-runtime/macOS/Release/metal-window.ppm
          ./portable-runtime/macOS/Release/bin/GameEnginePortable --backend metal --validate --offscreen --model Asset/Model/cube.obj --width 480 --height 320 --capture portable-runtime/macOS/Release/metal-model.ppm
          if cmp -s portable-runtime/macOS/Release/metal.ppm portable-runtime/macOS/Release/metal-model.ppm; then
            echo 'Imported model did not change the GPU output' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: portable-runtime-${{ runner.os }}
          path: portable-runtime/

  build-x64:
    if: github.event_name != 'workflow_dispatch' || inputs.target_platform == 'all' || inputs.target_platform == 'Windows' || inputs.target_platform == ''
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      BUILD_CONFIGURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.configuration || 'Debug' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          show-progress: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        shell: pwsh
        run: |
          msbuild GameEngine.sln /m /restore /t:Build `
            /p:Configuration="$env:BUILD_CONFIGURATION" `
            /p:Platform=x64 `
            /p:UseSharedCompilation=false `
            /p:RunCodeAnalysis=false `
            /verbosity:minimal
