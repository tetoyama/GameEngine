name: Run AgentOS Targeted Bugfix

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/agentos-targeted-bugfix-pr.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Extract and apply targeted patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/agentos-targeted-bugfix.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          lines = source[start:end].splitlines()
          patch_source = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines
          ) + "\n"
          Path('/tmp/apply_agentos_bugfix.py').write_text(patch_source, encoding='utf-8')
          PY
          python3 /tmp/apply_agentos_bugfix.py

      - name: Run AgentOS core tests
        shell: bash
        run: make -f Tests/AgentOS/Makefile -j2

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Source/GameApplication/AgentOS/Core/Agents/IntakeAgent.cpp \
            Source/GameApplication/AgentOS/Core/Agents/RetrievalWorker.cpp \
            Source/GameApplication/AgentOS/Core/Agents/SynthesisAgent.cpp \
            Source/GameApplication/AgentOS/Core/Llm/PromptTemplates.cpp \
            Source/GameApplication/AgentOS/Core/Orchestrator/Orchestrator.cpp \
            Tests/AgentOS/Makefile \
            Tests/AgentOSAmbiguityAndSynthesisSafetySmokeTest.cpp
          git commit -m "Fix AgentOS evidence and ambiguity handling"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
