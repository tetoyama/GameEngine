name: System Access Contract Smoke Test

on:
  pull_request:
    branches:
      - master
    paths:
      - "Source/GameApplication/Engine/Scene/System/Scheduler/SystemAccess.h"
      - "Tests/SystemAccessContractSmokeTest.cpp"
      - ".github/workflows/system-access-contract.yml"
  push:
    branches:
      - refactor/ecs-scheduler-foundation
    paths:
      - "Source/GameApplication/Engine/Scene/System/Scheduler/SystemAccess.h"
      - "Tests/SystemAccessContractSmokeTest.cpp"
      - ".github/workflows/system-access-contract.yml"
  workflow_dispatch:

concurrency:
  group: system-access-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile and run system access contract
        id: system_access_contract
        continue-on-error: true
        shell: cmd
        run: |
          cl /nologo /utf-8 /std:c++20 /EHsc /W4 /WX ^
            /I Source ^
            /I Source/GameApplication ^
            /I Source/GameApplication/Engine ^
            Tests/SystemAccessContractSmokeTest.cpp ^
            /Fe:system-access-contract-test.exe ^
            > system-access-contract.log 2>&1
          if errorlevel 1 exit /b 1
          system-access-contract-test.exe >> system-access-contract.log 2>&1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-access-contract-diagnostics
          path: system-access-contract.log
          if-no-files-found: error
      - name: Preserve smoke result
        if: steps.system_access_contract.outcome == 'failure'
        run: cmd /c exit 1
