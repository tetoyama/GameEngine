name: Apply AgentOS memory and context fixes

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/agentos-memory-context-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply targeted fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one occurrence, got {count}')
              return text.replace(old, new, 1)

          def replace_regex(text, pattern, replacement, label):
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one regex occurrence, got {count}')
              return new_text

          # -----------------------------------------------------------------
          # TaskStore: raw ConversationTurn and structured Thread State split.
          # -----------------------------------------------------------------
          path = 'Source/GameApplication/AgentOS/Core/Store/TaskStore.h'
          text = read(path)
          text = replace_once(
              text,
              '\tResult SetConversationResponse(SessionId sessionId, const std::string& assistantText);\n',
              '\tResult SetConversationResponse(SessionId sessionId, const std::string& assistantText);\n'
              '\tResult SetConversationThreadState(SessionId sessionId, const Json& state);\n',
              'TaskStore.h thread state declaration')
          text = text.replace(
              '// {summary, summarizedThroughSessionId, recentTurns, totalTurns}。',
              '// {summary, summarizedThroughSessionId, recentTurns, threadStates, totalTurns}。')
          write(path, text)

          path = 'Source/GameApplication/AgentOS/Core/Store/TaskStore.cpp'
          text = read(path)
          text = replace_once(text, '#include <string>\n', '#include <string>\n#include <vector>\n', 'TaskStore.cpp includes')
          schema_marker = (
              '\t\t// 古いTurnをPromptへ渡すための累積要約。原文Turnは削除しない。\n'
              '\t\t"CREATE TABLE IF NOT EXISTS ConversationMemory("')
          schema_insert = (
              '\t\t// Promptへ渡すのはRaw assistant本文ではなく、Intakeが確定した構造化状態だけ。\n'
              '\t\t"CREATE TABLE IF NOT EXISTS ConversationThreadState("\n'
              '\t\t"  session_id INTEGER PRIMARY KEY REFERENCES Session(id),"\n'
              '\t\t"  state_json TEXT NOT NULL DEFAULT \'{}\',"\n'
              '\t\t"  created_at TEXT NOT NULL DEFAULT (datetime(\'now\')),"\n'
              '\t\t"  updated_at TEXT NOT NULL DEFAULT (datetime(\'now\'))"\n'
              '\t\t");"\n\n'
              '\t\t// 古いTurnの累積要約は監査・移行互換として保持する。通常Promptへは渡さない。\n'
              '\t\t"CREATE TABLE IF NOT EXISTS ConversationMemory("')
          text = replace_once(text, schema_marker, schema_insert, 'TaskStore schema')
          text = replace_once(
              text,
              '\t\t"CREATE INDEX IF NOT EXISTS idx_conversation_turn_session_id ON ConversationTurn(session_id);";',
              '\t\t"CREATE INDEX IF NOT EXISTS idx_conversation_turn_session_id ON ConversationTurn(session_id);"\n'
              '\t\t"CREATE INDEX IF NOT EXISTS idx_conversation_thread_state_session_id "\n'
              '\t\t"ON ConversationThreadState(session_id);";',
              'TaskStore thread state index')

          thread_state_method = r'''
          Result TaskStore::SetConversationThreadState(SessionId sessionId, const Json& state) {
          	if (!state.is_object() || state.empty()) {
          		return Result::Fail("SetConversationThreadState: state must be a non-empty object");
          	}

          	std::lock_guard<std::mutex> lock(mutex_);
          	Transaction tx(db_);
          	Statement stmt;
          	Result r = db_.Prepare(
          		"INSERT INTO ConversationThreadState(session_id, state_json) VALUES(?1, ?2) "
          		"ON CONFLICT(session_id) DO UPDATE SET state_json=excluded.state_json, "
          		"updated_at=datetime('now');",
          		&stmt);
          	if (!r) return r;
          	stmt.BindInt64(1, sessionId);
          	stmt.BindText(2, state.dump());
          	if (stmt.Step() == Statement::StepResult::Error) {
          		return Result::Fail(sqlite3_errmsg(db_.Handle()));
          	}
          	return tx.Commit();
          }

          '''
          text = replace_once(
              text,
              'Json TaskStore::GetConversationContext(SessionId beforeSessionId) {',
              thread_state_method + 'Json TaskStore::GetConversationContext(SessionId beforeSessionId) {',
              'TaskStore thread state setter')

          context_assignment = '''
          \tcontext["summary"] = summary;
          \tcontext["summarizedThroughSessionId"] = summarizedThrough;
          \tcontext["recentTurns"] = std::move(recentTurns);
          \tcontext["totalTurns"] = totalTurns;
          \treturn context;
          '''
          context_replacement = '''
          \tJson threadStates = Json::array();
          \tstd::vector<Json> reversedStates;
          \tStatement states;
          \tr = db_.Prepare(
          \t\t"SELECT session_id, state_json FROM ConversationThreadState "
          \t\t"WHERE session_id < ?1 ORDER BY session_id DESC LIMIT 8;",
          \t\t&states);
          \tif (r) {
          \t\tstates.BindInt64(1, beforeSessionId);
          \t\twhile (states.Step() == Statement::StepResult::Row) {
          \t\t\tJson state = Json::parse(states.ColumnText(1), nullptr, false);
          \t\t\tif (!state.is_object() || state.is_discarded()) continue;
          \t\t\tstate["sessionId"] = states.ColumnInt64(0);
          \t\t\treversedStates.push_back(std::move(state));
          \t\t}
          \t}
          \tfor (auto it = reversedStates.rbegin(); it != reversedStates.rend(); ++it) {
          \t\tthreadStates.push_back(*it);
          \t}

          \tcontext["summary"] = summary;
          \tcontext["summarizedThroughSessionId"] = summarizedThrough;
          \tcontext["recentTurns"] = std::move(recentTurns);
          \tcontext["threadStates"] = std::move(threadStates);
          \tcontext["totalTurns"] = totalTurns;
          \treturn context;
          '''
          text = replace_once(text, context_assignment, context_replacement, 'TaskStore context thread states')
          write(path, text)

          # -----------------------------------------------------------------
          # Intake: classify before LLM, retrieve only structured state.
          # -----------------------------------------------------------------
          path = 'Source/GameApplication/AgentOS/Core/Agents/IntakeAgent.cpp'
          text = read(path)
          text = text.replace(
              'Result CompressStoredConversationIfNeeded(AgentContext& ctx, Json* context) {',
              '[[maybe_unused]] Result CompressStoredConversationIfNeeded(AgentContext& ctx, Json* context) {',
              1)

          helper_block = r'''bool IsSimpleConversationInput(const std::string& userRequest) {
          	if (userRequest.empty() || userRequest.size() > 96) return false;
          	const bool greeting = ContainsAny(userRequest, {
          		"こんにちは", "こんばんは", "おはよう", "はじめまして", "ありがとう", "よろしく",
          		"Hello", "hello", "Hi", "hi"
          	});
          	const bool engineRequest = ContainsAny(userRequest, {
          		"Entity", "Component", "System", "シーン", "コード", "調査", "確認", "一覧", "修正"
          	});
          	return greeting && !engineRequest;
          }

          bool IsFreshRuntimeRequest(const std::string& userRequest) {
          	return ContainsAny(userRequest, {
          		"今のシーン", "現在のシーン", "最新のシーン", "今の状態", "現在の状態",
          		"今いるEntity", "現在のEntity", "シーンの状況", "runtime state", "current scene"
          	});
          }

          bool IsExplicitCorrection(const std::string& userRequest) {
          	return ContainsAny(userRequest, {
          		"違う", "そうじゃなくて", "ではなく", "じゃなく", "正しくは", "訂正",
          		"あるはず", "のはず"
          	});
          }

          bool IsContinuationReferenceInput(const std::string& userRequest) {
          	if (userRequest.empty() || userRequest.size() > 320) return false;
          	return ContainsAny(userRequest, {
          		"続けて", "続き", "それ", "これ", "この件", "前の", "さっき", "先ほど",
          		"もう一度", "どういうこと", "同じ", "引き続き", "その"
          	});
          }

          bool RequiresPriorThreadContext(const std::string& userRequest) {
          	return IsExplicitCorrection(userRequest) || IsContinuationReferenceInput(userRequest);
          }

          Json EmptyStructuredContext(const std::string& policy, const Json& fullContext = Json::object()) {
          	Json selected = Json::object();
          	selected["summary"] = "";
          	selected["summarizedThroughSessionId"] =
          		fullContext.value("summarizedThroughSessionId", kInvalidId);
          	selected["totalTurns"] = fullContext.value("totalTurns", 0);
          	selected["recentTurns"] = Json::array();
          	selected["threadStates"] = Json::array();
          	selected["selectionPolicy"] = policy;
          	selected["memoryPolicy"] = "structured_thread_state_only";
          	return selected;
          }

          Json UserOnlyTurn(const Json& turn) {
          	Json result = Json::object();
          	if (!turn.is_object()) return result;
          	if (turn.contains("sessionId")) result["sessionId"] = turn.at("sessionId");
          	result["user"] = prompts::Truncate(turn.value("user", std::string()), 600);
          	return result;
          }

          Json BuildIntakePromptContext(const std::string& userRequest, const Json& fullContext) {
          	if (IsSimpleConversationInput(userRequest)) {
          		return EmptyStructuredContext("active_turn_only", fullContext);
          	}
          	if (IsFreshRuntimeRequest(userRequest)) {
          		return EmptyStructuredContext("fresh_runtime_observation", fullContext);
          	}
          	if (!RequiresPriorThreadContext(userRequest)) {
          		return EmptyStructuredContext("active_turn_only", fullContext);
          	}

          	Json selected = EmptyStructuredContext("structured_thread_reference", fullContext);
          	if (fullContext.contains("threadStates") && fullContext.at("threadStates").is_array()) {
          		const Json& states = fullContext.at("threadStates");
          		const std::size_t begin = states.size() > 3 ? states.size() - 3 : 0;
          		for (std::size_t i = begin; i < states.size(); ++i) {
          			if (states[i].is_object()) selected["threadStates"].push_back(states[i]);
          		}
          	}

          	// 既存DBにThread Stateがまだ無い場合だけ、user本文のみを短く渡す。
          	// assistant本文は過去の誤答・Tool出力・巨大一覧を再注入するため絶対に渡さない。
          	if (selected["threadStates"].empty() && fullContext.contains("recentTurns") &&
          	    fullContext.at("recentTurns").is_array()) {
          		const Json& turns = fullContext.at("recentTurns");
          		const std::size_t begin = turns.size() > 2 ? turns.size() - 2 : 0;
          		for (std::size_t i = begin; i < turns.size(); ++i) {
          			const Json userOnly = UserOnlyTurn(turns[i]);
          			if (!userOnly.empty()) selected["recentTurns"].push_back(userOnly);
          		}
          		selected["selectionPolicy"] = "legacy_user_text_fallback";
          	}
          	return selected;
          }

          Json SelectConversationContext(
          	const Json& promptContext,
          	const std::string& relation,
          	const Json& referencedSessionIds) {

          	if (relation == "new" || relation == "refresh") {
          		return EmptyStructuredContext(
          			relation == "refresh" ? "fresh_runtime_observation" : "active_turn_only",
          			promptContext);
          	}

          	Json selected = EmptyStructuredContext("structured_" + relation, promptContext);
          	std::unordered_set<SessionId> referenced;
          	if (referencedSessionIds.is_array()) {
          		for (const Json& id : referencedSessionIds) {
          			if (id.is_number_integer()) referenced.insert(id.get<SessionId>());
          		}
          	}

          	auto appendMatching = [&](const Json& values, const char* destination) {
          		if (!values.is_array()) return;
          		for (const Json& value : values) {
          			if (!value.is_object()) continue;
          			if (!referenced.empty()) {
          				if (!value.contains("sessionId") || !value.at("sessionId").is_number_integer() ||
          				    referenced.count(value.at("sessionId").get<SessionId>()) == 0) continue;
          			}
          			selected[destination].push_back(value);
          		}
          	};

          	if (promptContext.contains("threadStates")) {
          		appendMatching(promptContext.at("threadStates"), "threadStates");
          	}
          	if (selected["threadStates"].empty() && promptContext.contains("recentTurns")) {
          		appendMatching(promptContext.at("recentTurns"), "recentTurns");
          	}
          	if (!referenced.empty()) selected["selectionPolicy"] = "explicit_structured_session_reference";
          	return selected;
          }

          Json BuildThreadState(SessionId sessionId, const Json& intake) {
          	Json state = Json::object();
          	state["sessionId"] = sessionId;
          	state["goal"] = intake.value("goal", std::string());
          	state["resolvedRequest"] = intake.value("resolvedRequest", std::string());
          	state["turnRelation"] = intake.value("turnRelation", std::string("new"));
          	state["requestType"] = intake.value("requestType", std::string("investigation"));
          	state["targets"] = Json::object({
          		{"kind", intake.value("targetKind", std::string("unknown"))},
          		{"concept", intake.contains("targetConcept") ? intake.at("targetConcept") : Json(nullptr)},
          		{"entityName", intake.contains("resolvedEntityName") ? intake.at("resolvedEntityName") : Json(nullptr)},
          	});
          	state["constraints"] = intake.value("constraints", Json::array());
          	state["unresolved"] = intake.value("unresolvedReferences", Json::array());
          	state["status"] = intake.value("simpleConversation", false) ? "conversation" : "active";
          	return state;
          }

          '''
          text = replace_regex(
              text,
              r'bool IsSimpleConversationInput\(.*?\n\}\n\nvoid CollectIdentifiersFromText',
              helper_block + 'void CollectIdentifiersFromText',
              'Intake context helper block')

          new_extract = r'''Json ExtractHistoryIdentifiers(const Json& structuredContext) {
          	std::unordered_set<std::string> identifiers;
          	if (structuredContext.is_object()) {
          		if (structuredContext.contains("threadStates") && structuredContext.at("threadStates").is_array()) {
          			for (const Json& state : structuredContext.at("threadStates")) {
          				if (!state.is_object()) continue;
          				CollectIdentifiersFromText(state.value("goal", std::string()), &identifiers);
          				CollectIdentifiersFromText(state.value("resolvedRequest", std::string()), &identifiers);
          				if (state.contains("targets")) CollectIdentifiersFromText(state.at("targets").dump(), &identifiers);
          			}
          		}
          		if (structuredContext.contains("recentTurns") && structuredContext.at("recentTurns").is_array()) {
          			for (const Json& turn : structuredContext.at("recentTurns")) {
          				if (turn.is_object()) CollectIdentifiersFromText(turn.value("user", std::string()), &identifiers);
          			}
          		}
          	}
          	Json result = Json::array();
          	std::vector<std::string> ordered(identifiers.begin(), identifiers.end());
          	std::sort(ordered.begin(), ordered.end());
          	for (const std::string& identifier : ordered) result.push_back(identifier);
          	return result;
          }
          '''
          text = replace_regex(
              text,
              r'Json ExtractHistoryIdentifiers\(.*?\n\}\n\n\} // namespace',
              new_extract + '\n} // namespace',
              'Intake history identifiers')

          new_run = r'''Result IntakeAgent::Run(
          	AgentContext& ctx,
          	const std::string& userRequest,
          	const Json& conversationContext,
          	Json* intakeOut) {

          	prompts::ClearCurrentConversationRequestContext();
          	if (intakeOut == nullptr) return Result::Fail("IntakeAgent: intakeOut is null");

          	// 挨拶は履歴解決を必要としない。LLMへ全Conversation Storeを渡してから
          	// newへ戻す旧順序では、過去の未完了調査が入力を上書きしていた。
          	if (IsSimpleConversationInput(userRequest)) {
          		Json normalized = Json::object({
          			{"goal", "ユーザーの挨拶または短い会話へ応答する"},
          			{"resolvedRequest", "現在のユーザー入力に対して短く自然に会話応答する"},
          			{"rootGoal", "ユーザーの挨拶または短い会話へ応答する"},
          			{"rootResolvedRequest", "現在のユーザー入力に対して短く自然に会話応答する"},
          			{"turnRelation", "new"},
          			{"referencedSessionIds", Json::array()},
          			{"symptoms", Json::array()},
          			{"constraints", Json::array()},
          			{"requiredCapabilities", Json::array()},
          			{"unresolvedReferences", Json::array()},
          			{"memoryDerivedNotes", Json::array()},
          			{"targetKind", "unknown"},
          			{"targetConcept", nullptr},
          			{"resolvedEntityName", nullptr},
          			{"requestType", "conversation"},
          			{"currentUserInput", userRequest},
          			{"requestRevision", 0},
          			{"historyIdentifiers", Json::array()},
          			{"simpleConversation", true},
          		});
          		const Json selectedContext = EmptyStructuredContext("active_turn_only");
          		normalized["conversationContext"] = selectedContext;
          		if (ctx.store != nullptr && ctx.sessionId != kInvalidId) {
          			(void)ctx.store->SetConversationThreadState(ctx.sessionId, BuildThreadState(ctx.sessionId, normalized));
          		}
          		prompts::SetCurrentConversationRequestContext(selectedContext, normalized);
          		*intakeOut = std::move(normalized);
          		return Result::Ok();
          	}

          	Json fullContext = conversationContext;
          	if (RequiresPriorThreadContext(userRequest) &&
          	    (!fullContext.is_object() || fullContext.empty()) &&
          	    ctx.store != nullptr && ctx.sessionId != kInvalidId) {
          		fullContext = ctx.store->GetConversationContext(ctx.sessionId);
          	}
          	const Json promptContext = BuildIntakePromptContext(userRequest, fullContext);

          	const PromptPair prompt = prompts::Intake(userRequest, promptContext);
          	Json raw;
          	Result callResult = CallLlmJson(ctx, prompt, &raw);
          	if (!callResult) return callResult;

          	if (!raw.is_object() || !raw.contains("goal") || !raw.at("goal").is_string() ||
          	    raw.at("goal").get<std::string>().empty()) {
          		return Result::Fail("IntakeAgent: response missing non-empty string 'goal'");
          	}

          	Json normalized = Json::object();
          	std::string goal = raw.at("goal").get<std::string>();
          	std::string resolvedRequest = goal;
          	if (raw.contains("resolvedRequest") && raw.at("resolvedRequest").is_string() &&
          	    !raw.at("resolvedRequest").get<std::string>().empty()) {
          		resolvedRequest = raw.at("resolvedRequest").get<std::string>();
          	}
          	std::string relation = NormalizeRelation(raw);

          	std::string requestType = "investigation";
          	if (raw.contains("requestType") && raw.at("requestType").is_string()) {
          		const std::string rawType = raw.at("requestType").get<std::string>();
          		if (rawType == "conversation" || rawType == "investigation") requestType = rawType;
          	}

          	normalized["goal"] = goal;
          	normalized["resolvedRequest"] = resolvedRequest;
          	normalized["rootGoal"] = goal;
          	normalized["rootResolvedRequest"] = resolvedRequest;
          	normalized["turnRelation"] = relation;
          	NormalizeStringArray(raw, "symptoms", &normalized);
          	NormalizeStringArray(raw, "constraints", &normalized);
          	NormalizeStringArray(raw, "requiredCapabilities", &normalized);
          	NormalizeStringArray(raw, "unresolvedReferences", &normalized);
          	normalized["referencedSessionIds"] = NormalizeReferencedSessionIds(raw);
          	normalized["requestType"] = requestType;
          	normalized["currentUserInput"] = userRequest;
          	normalized["requestRevision"] = 0;

          	const std::string targetKind = raw.value("targetKind", std::string("unknown"));
          	normalized["targetKind"] = targetKind;
          	normalized["targetConcept"] = raw.contains("targetConcept") && raw.at("targetConcept").is_string()
          		? raw.at("targetConcept")
          		: Json(nullptr);
          	normalized["resolvedEntityName"] =
          		raw.contains("resolvedEntityName") && raw.at("resolvedEntityName").is_string()
          			? raw.at("resolvedEntityName")
          			: Json(nullptr);

          	const bool hasPreviousTurns =
          		(promptContext.contains("threadStates") && promptContext.at("threadStates").is_array() &&
          		 !promptContext.at("threadStates").empty()) ||
          		(promptContext.contains("recentTurns") && promptContext.at("recentTurns").is_array() &&
          		 !promptContext.at("recentTurns").empty());
          	if (IsFreshRuntimeRequest(userRequest)) {
          		relation = "refresh";
          		requestType = "investigation";
          		normalized["referencedSessionIds"] = Json::array();
          	} else if (hasPreviousTurns && IsExplicitCorrection(userRequest)) {
          		relation = "correct";
          	}
          	normalized["turnRelation"] = relation;
          	normalized["requestType"] = requestType;

          	ApplyMemoryGroundingFilter(userRequest, resolvedRequest, &normalized);

          	const Json selectedContext = SelectConversationContext(
          		promptContext,
          		relation,
          		normalized.value("referencedSessionIds", Json::array()));
          	normalized["historyIdentifiers"] = ExtractHistoryIdentifiers(selectedContext);
          	normalized["conversationContext"] = selectedContext;

          	if (ctx.store != nullptr && ctx.sessionId != kInvalidId) {
          		(void)ctx.store->SetConversationThreadState(ctx.sessionId, BuildThreadState(ctx.sessionId, normalized));
          	}
          	prompts::SetCurrentConversationRequestContext(selectedContext, normalized);
          	*intakeOut = std::move(normalized);
          	return Result::Ok();
          }
          '''
          text = replace_regex(
              text,
              r'Result IntakeAgent::Run\(.*?\n\}\n\n\} // namespace agentos',
              new_run + '\n\n} // namespace agentos',
              'Intake Run')
          write(path, text)

          # -----------------------------------------------------------------
          # Prompt templates: structured states only, no assistant prose.
          # -----------------------------------------------------------------
          path = 'Source/GameApplication/AgentOS/Core/Llm/PromptTemplates.cpp'
          text = read(path)
          context_text = r'''// DB原文保存とは分離したPrompt用Context。
          // Raw assistant本文・Tool一覧全文・累積prose summaryは推論へ再投入せず、
          // Intakeが確定した構造化Thread Stateだけを予算内へ詰める。
          std::string ContextText(const Json& supplied) {
          	const Json& context = supplied.is_object() && !supplied.empty()
          		? supplied
          		: g_conversationContext;
          	if (!context.is_object() || context.empty()) return "(今回の生成に使用する会話状態なし)";

          	constexpr std::size_t kContextBudget = 7000;
          	Json packed = Json::object();
          	packed["totalTurns"] = context.value("totalTurns", 0);
          	packed["selectionPolicy"] = context.value("selectionPolicy", std::string("structured"));
          	packed["memoryPolicy"] = "structured_thread_state_only";

          	Json selectedStates = Json::array();
          	if (context.contains("threadStates") && context.at("threadStates").is_array()) {
          		const Json& states = context.at("threadStates");
          		for (std::size_t start = states.size(); start > 0; --start) {
          			Json candidate = Json::array();
          			for (std::size_t i = start - 1; i < states.size(); ++i) candidate.push_back(states[i]);
          			Json candidateContext = packed;
          			candidateContext["threadStates"] = candidate;
          			if (candidateContext.dump().size() <= kContextBudget) {
          				selectedStates = std::move(candidate);
          				continue;
          			}
          			break;
          		}
          	}
          	packed["threadStates"] = std::move(selectedStates);

          	Json userFallback = Json::array();
          	if (packed["threadStates"].empty() && context.contains("recentTurns") &&
          	    context.at("recentTurns").is_array()) {
          		for (const Json& turn : context.at("recentTurns")) {
          			if (!turn.is_object()) continue;
          			Json item = Json::object();
          			if (turn.contains("sessionId")) item["sessionId"] = turn.at("sessionId");
          			item["user"] = Truncate(turn.value("user", std::string()), 600);
          			userFallback.push_back(std::move(item));
          		}
          	}
          	packed["recentUserTurns"] = std::move(userFallback);
          	return packed.dump(2);
          }
          '''
          text = replace_regex(
              text,
              r'// DB原文保存とは分離したPrompt用Context.*?std::string RequestContextText\(\)',
              context_text + '\nstd::string RequestContextText()',
              'Prompt ContextText')
          text = text.replace(
              '\n\n選択済みConversation Context（補助情報）:\n',
              '\n\n選択済みConversation Thread State（補助情報）:\n')
          text = text.replace(
              '全Conversation Storeの履歴と現在入力から、今回の要求を単独で意味の通る形へ解決するIntake担当。\n'
              '\t\t"- この段階だけは全履歴を参照してよい。後続Agentへ渡す履歴はプログラム側が選択する。\\n"',
              '現在入力と、プログラム側で事前選択された構造化Thread Stateから、今回の要求を単独で意味の通る形へ解決するIntake担当。\n'
              '\t\t"- Raw Conversation Logや過去assistant本文は参照しない。必要な状態だけがThread Stateとして渡される。\\n"')
          text = text.replace(
              'p.user = "Conversation Storeの履歴:\\n" + ContextText(conversationContext) +',
              'p.user = "選択済みConversation Thread State:\\n" + ContextText(conversationContext) +')
          text = text.replace(
              '"優先順位は current input/resolvedRequest > selectedTurns > summary。\\n"',
              '"優先順位は current input/resolvedRequest > structured Thread State。\\n"')
          text = text.replace(
              '"- selected contextは補助情報であり、現在要求を上書きしてはならない。\\n"',
              '"- structured Thread Stateは補助情報であり、現在要求を上書きしてはならない。\\n"')
          text = text.replace(
              '\n\n選択済み会話Context:\n',
              '\n\n選択済みConversation Thread State:\n')
          write(path, text)

          # -----------------------------------------------------------------
          # LLAMAAgent: cancel snapshot must die with one top-level inference.
          # -----------------------------------------------------------------
          path = 'Source/GameApplication/Service/LlamaService/LLAMAAgent.h'
          text = read(path)
          old_sig = '''\t// [修正] retryDepth を追加。
          \t// コンテキストオーバーフロー時に SummarizeAndReset() を挟んで自分自身を
          \t// 再帰呼び出しする経路があるが、要約してもオーバーフローが解消しない
          \t// 異常系で無限再帰に陥らないようにするための深度ガード。
          \tvoid RunPromptInternal(const std::string& prompt, int retryDepth = 0);
          '''
          new_sig = '''\tstruct CancelSnapshot {
          \t\tstd::vector<MessageEntry> history;
          \t\tstd::vector<llama_token> pastTokens;
          \t\tint nPast = 0;
          \t\tbool valid = false;
          \t};

          \t// Snapshotはtop-level推論のstack所有。thread_local capacityをWorker終了まで
          \t// 保持しない。再帰リトライ時だけ同じSnapshotへの非所有pointerを渡す。
          \tvoid RunPromptInternal(
          \t\tconst std::string& prompt,
          \t\tint retryDepth = 0,
          \t\tCancelSnapshot* snapshot = nullptr);
          '''
          text = replace_once(text, old_sig, new_sig, 'LLAMAAgent.h snapshot signature')
          write(path, text)

          path = 'Source/GameApplication/Service/LlamaService/LLAMAAgent.cpp'
          text = read(path)
          text = replace_once(
              text,
              'void LLAMAAgent::RunPromptInternal(const std::string& prompt, int retryDepth){',
              'void LLAMAAgent::RunPromptInternal(\n'
              '\tconst std::string& prompt,\n'
              '\tint retryDepth,\n'
              '\tCancelSnapshot* snapshot){',
              'LLAMAAgent.cpp function signature')
          snapshot_block = r'''\t// =====================================================
          \t// Cancel rollback snapshot (top-level prompt unit)
          \t// =====================================================
          \tCancelSnapshot localSnapshot;
          \tCancelSnapshot* activeSnapshot = snapshot;
          \tif(activeSnapshot == nullptr){
          \t\tactiveSnapshot = &localSnapshot;
          \t\tactiveSnapshot->history = m_history;
          \t\tactiveSnapshot->pastTokens = m_pastTokens;
          \t\tactiveSnapshot->nPast = m_nPast;
          \t\tactiveSnapshot->valid = true;
          \t}

          '''
          text = replace_regex(
              text,
              r'\t// =====================================================\n\t// Cancel rollback snapshot \(top-level prompt unit\).*?\t\} snapshotScope\{retryDepth\};\n\n',
              snapshot_block,
              'LLAMAAgent snapshot block')
          text = text.replace('s_cancelSnapshot.', 'activeSnapshot->')
          text = replace_once(
              text,
              'RunPromptInternal(prompt, retryDepth + 1);',
              'RunPromptInternal(prompt, retryDepth + 1, activeSnapshot);',
              'LLAMAAgent recursive snapshot')

          reset_old = '''\tm_pastTokens.clear();
          \tm_nPast = 0;
          \tm_history.clear();
          \tm_summaryText.clear();

          \t{
          \t\tstd::lock_guard<std::mutex> o(m_outputMutex);
          \t\tm_output.clear();
          \t\tm_visibleOutput.clear();
          \t}
          '''
          reset_new = '''\tm_pastTokens.clear();
          \tm_nPast = 0;
          \tm_history.clear();
          \tm_summaryText.clear();

          \t// 通常はcapacityを再利用する。異常に膨張した一時PromptだけはReset時に返却し、
          \t// 一度の巨大Conversation Contextが以後の常駐メモリ量を固定しないようにする。
          \tconst std::size_t tokenCapacityLimit = (std::max)(
          \t\tstatic_cast<std::size_t>(m_config ? m_config->n_ctx * 2u : 0u),
          \t\tstatic_cast<std::size_t>(65536));
          \tif(m_pastTokens.capacity() > tokenCapacityLimit){
          \t\tstd::vector<llama_token>().swap(m_pastTokens);
          \t}
          \tif(m_history.capacity() > 128){
          \t\tstd::vector<MessageEntry>().swap(m_history);
          \t}
          \tif(m_summaryText.capacity() > 65536){
          \t\tstd::string().swap(m_summaryText);
          \t}

          \t{
          \t\tstd::lock_guard<std::mutex> o(m_outputMutex);
          \t\tm_output.clear();
          \t\tm_visibleOutput.clear();
          \t\tif(m_output.capacity() > 65536) std::string().swap(m_output);
          \t\tif(m_visibleOutput.capacity() > 65536) std::string().swap(m_visibleOutput);
          \t}
          '''
          text = replace_once(text, reset_old, reset_new, 'LLAMAAgent oversized buffer release')
          write(path, text)

          # Drain deferred jobs/callback captures before backend shutdown.
          path = 'Source/GameApplication/Service/LlamaService/LLAMAService.cpp'
          text = read(path)
          shutdown_marker = '''\tif(m_workerThread.joinable()){
          \t\tm_workerThread.join();
          \t}

          \t{
          \t\tstd::lock_guard<std::mutex> lock(m_completedMutex);
          '''
          shutdown_replacement = '''\tif(m_workerThread.joinable()){
          \t\tm_workerThread.join();
          \t}

          \t{
          \t\tstd::lock_guard<std::mutex> lock(m_jobMutex);
          \t\twhile(!m_modelJobQueue.empty()) m_modelJobQueue.pop();
          \t\twhile(!m_agentJobQueue.empty()) m_agentJobQueue.pop();
          \t}

          \t{
          \t\tstd::lock_guard<std::mutex> lock(m_completedMutex);
          '''
          text = replace_once(text, shutdown_marker, shutdown_replacement, 'LLAMAService queue drain')
          write(path, text)

          # -----------------------------------------------------------------
          # Regression test.
          # -----------------------------------------------------------------
          test_path = Path('Tests/AgentOSStructuredConversationContextSmokeTest.cpp')
          test_path.write_text(r'''// =======================================================================
          //
          // AgentOSStructuredConversationContextSmokeTest.cpp
          //
          // Raw assistant本文をPromptへ再注入せず、構造化Thread Stateだけを参照する。
          // =======================================================================
          #include "AgentOS/Core/Agents/AgentContext.h"
          #include "AgentOS/Core/Agents/IntakeAgent.h"
          #include "AgentOS/Core/Llm/MockLlmBackend.h"
          #include "AgentOS/Core/Store/TaskStore.h"

          #include <cassert>
          #include <cstdio>
          #include <iostream>
          #include <string>

          using namespace agentos;

          namespace {

          void RemoveDb(const std::string& path) {
          	std::remove(path.c_str());
          	std::remove((path + "-wal").c_str());
          	std::remove((path + "-shm").c_str());
          	std::remove((path + "-journal").c_str());
          }

          SessionId AddTurn(
          	TaskStore& store,
          	const std::string& user,
          	const std::string& assistant,
          	const Json& state) {
          	const SessionId session = store.CreateSession(Json::object({{"userRequest", user}}));
          	assert(session != kInvalidId);
          	assert(store.SetConversationResponse(session, assistant));
          	assert(store.SetConversationThreadState(session, state));
          	assert(store.UpdateSessionState(session, "Completed"));
          	return session;
          }

          void GreetingSkipsHistoryAndIntakeLlm() {
          	const std::string dbPath = "/tmp/agentos_structured_greeting.db";
          	RemoveDb(dbPath);
          	TaskStore store;
          	assert(store.Open(dbPath));
          	AddTurn(
          		store,
          		"プレイヤーのジャンプ力を教えて",
          		"RAW_ASSISTANT_SECRET: 権限制限により調査を続行する",
          		Json::object({
          			{"goal", "ジャンプ速度を取得する"},
          			{"resolvedRequest", "PlatformerPlayerのジャンプ速度を取得する"},
          			{"turnRelation", "new"},
          			{"requestType", "investigation"},
          			{"targets", Json::object({{"entityName", "PlatformerPlayer"}})},
          		}));
          	const SessionId current = store.CreateSession(Json::object({{"userRequest", "こんにちは"}}));

          	MockLlmBackend llm;
          	AgentContext ctx;
          	ctx.llm = &llm;
          	ctx.store = &store;
          	ctx.sessionId = current;
          	Json intake;
          	assert(IntakeAgent::Run(ctx, "こんにちは", &intake));
          	assert(llm.GetCalls().empty());
          	assert(intake.value("turnRelation", std::string()) == "new");
          	assert(intake.value("simpleConversation", false));
          	assert(intake.at("conversationContext").at("threadStates").empty());
          	assert(intake.at("conversationContext").at("recentTurns").empty());
          	RemoveDb(dbPath);
          }

          void ContinuationUsesOnlyStructuredState() {
          	const std::string dbPath = "/tmp/agentos_structured_continue.db";
          	RemoveDb(dbPath);
          	TaskStore store;
          	assert(store.Open(dbPath));
          	AddTurn(
          		store,
          		"PlatformerPlayerのジャンプ力を教えて",
          		"RAW_ASSISTANT_SECRET: " + std::string(12000, 'X'),
          		Json::object({
          			{"goal", "ジャンプ速度を取得する"},
          			{"resolvedRequest", "PlatformerPlayerのPlatformerCharacterControllerからジャンプ速度を取得する"},
          			{"turnRelation", "new"},
          			{"requestType", "investigation"},
          			{"targets", Json::object({
          				{"kind", "field"},
          				{"entityName", "PlatformerPlayer"},
          				{"concept", "jump velocity"},
          			})},
          			{"unresolved", Json::array({"Field名"})},
          		}));
          	const SessionId current = store.CreateSession(Json::object({{"userRequest", "続けて"}}));

          	MockLlmBackend llm;
          	llm.EnqueueResponse(
          		"```json\n"
          		"{\"goal\":\"前の調査を続ける\","
          		"\"resolvedRequest\":\"PlatformerPlayerのPlatformerCharacterControllerからジャンプ速度を取得する\","
          		"\"turnRelation\":\"continue\",\"referencedSessionIds\":[],"
          		"\"symptoms\":[],\"constraints\":[],\"requiredCapabilities\":[],"
          		"\"unresolvedReferences\":[\"Field名\"],\"targetKind\":\"field\","
          		"\"targetConcept\":\"jump velocity\",\"resolvedEntityName\":\"PlatformerPlayer\","
          		"\"requestType\":\"investigation\"}\n```" );

          	AgentContext ctx;
          	ctx.llm = &llm;
          	ctx.store = &store;
          	ctx.sessionId = current;
          	Json intake;
          	assert(IntakeAgent::Run(ctx, "続けて", &intake));
          	const auto calls = llm.GetCalls();
          	assert(calls.size() == 1);
          	const std::string& prompt = calls.front().second;
          	assert(prompt.find("RAW_ASSISTANT_SECRET") == std::string::npos);
          	assert(prompt.find(std::string(1000, 'X')) == std::string::npos);
          	assert(prompt.find("PlatformerCharacterController") != std::string::npos);
          	assert(intake.at("conversationContext").at("threadStates").size() == 1);
          	RemoveDb(dbPath);
          }

          void RefreshDoesNotReceivePreviousState() {
          	const std::string dbPath = "/tmp/agentos_structured_refresh.db";
          	RemoveDb(dbPath);
          	TaskStore store;
          	assert(store.Open(dbPath));
          	AddTurn(
          		store,
          		"以前の質問",
          		"RAW_ASSISTANT_SECRET",
          		Json::object({
          			{"goal", "古い調査"},
          			{"resolvedRequest", "STALE_PLATFORMER_STATE"},
          			{"turnRelation", "new"},
          			{"requestType", "investigation"},
          		}));
          	const SessionId current = store.CreateSession(Json::object({{"userRequest", "今のシーンの状況を教えて"}}));

          	MockLlmBackend llm;
          	llm.EnqueueResponse(
          		"```json\n"
          		"{\"goal\":\"現在のシーンを確認する\",\"resolvedRequest\":\"現在のシーンを再観測する\","
          		"\"turnRelation\":\"refer\",\"referencedSessionIds\":[1],\"symptoms\":[],"
          		"\"constraints\":[],\"requiredCapabilities\":[\"ListEntities\"],"
          		"\"unresolvedReferences\":[],\"targetKind\":\"concept\","
          		"\"targetConcept\":\"current scene\",\"resolvedEntityName\":null,"
          		"\"requestType\":\"investigation\"}\n```" );

          	AgentContext ctx;
          	ctx.llm = &llm;
          	ctx.store = &store;
          	ctx.sessionId = current;
          	Json intake;
          	assert(IntakeAgent::Run(ctx, "今のシーンの状況を教えて", &intake));
          	const auto calls = llm.GetCalls();
          	assert(calls.size() == 1);
          	assert(calls.front().second.find("STALE_PLATFORMER_STATE") == std::string::npos);
          	assert(calls.front().second.find("RAW_ASSISTANT_SECRET") == std::string::npos);
          	assert(intake.value("turnRelation", std::string()) == "refresh");
          	assert(intake.at("conversationContext").at("threadStates").empty());
          	RemoveDb(dbPath);
          }

          } // namespace

          int main() {
          	std::cout << "=== AgentOS Structured Conversation Context Smoke Test ===\n";
          	GreetingSkipsHistoryAndIntakeLlm();
          	ContinuationUsesOnlyStructuredState();
          	RefreshDoesNotReceivePreviousState();
          	prompts::ClearCurrentConversationRequestContext();
          	std::cout << "=== ALL PASSED ===\n";
          	return 0;
          }
          ''', encoding='utf-8')

          path = 'Tests/AgentOS/Makefile'
          text = read(path)
          text = replace_once(
              text,
              '        AgentOSAmbiguityAndSynthesisSafetySmokeTest \\\n          \t        AgentOSVerticalSliceSmokeTest',
              '        AgentOSAmbiguityAndSynthesisSafetySmokeTest \\\n          \t        AgentOSStructuredConversationContextSmokeTest \\\n          \t        AgentOSVerticalSliceSmokeTest',
              'AgentOS Makefile test')
          write(path, text)
          PY

      - name: Build and run AgentOS core tests
        shell: bash
        run: make -f Tests/AgentOS/Makefile -j2

