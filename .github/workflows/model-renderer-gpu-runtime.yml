name: Model Renderer GPU Runtime Smoke Test

on:
  pull_request:
    branches: [master]
    paths:
      - "Source/GameApplication/Engine/Resources/Data/modelData.h"
      - "Source/GameApplication/Engine/Scene/Component/modelRendererComponent.h"
      - "Source/GameApplication/Engine/Scene/Component/Operations/ModelRendererRuntime.h"
      - "Source/GameApplication/Engine/Scene/System/Render/Animation/ModelRendererGpuRuntimeStorage.h"
      - "Source/GameApplication/Engine/Scene/System/Render/Animation/RenderSystemAnimationTaskRegistrar.h"
      - "Source/GameApplication/Engine/Scene/System/Render/Animation/RenderSystemAnimationTasks.inl"
      - "Source/GameApplication/Engine/Scene/System/Render/Model/**"
      - "Source/GameApplication/Engine/Scene/System/Render/RenderSystem/renderSystem.cpp"
      - "Source/GameApplication/Engine/Scene/System/Render/RenderSystem/renderSystem.h"
      - "Source/GameApplication/Engine/Scene/System/Render/RenderSystem/Renderable/Model/RenderableModel.cpp"
      - "Source/GameApplication/Service/Graphics/RHI/RHIInterfaces.h"
      - "Source/GameApplication/Service/Graphics/RHI/RHIService.h"
      - "Source/GameApplication/Service/Graphics/RHI/D3D11/D3D11RHIDevice.h"
      - "Tests/ModelRendererGpuRuntimeStorageSmokeTest.cpp"
      - "Tests/ModelGeometryRuntimeStorageSmokeTest.cpp"
      - "Docs/RHI_Device_Ownership_And_Model_Geometry_Revision_Contract.md"
      - ".github/workflows/model-renderer-gpu-runtime.yml"
  push:
    branches: [refactor/ecs-scheduler-foundation]
    paths:
      - "Source/GameApplication/Engine/Resources/Data/modelData.h"
      - "Source/GameApplication/Engine/Scene/Component/modelRendererComponent.h"
      - "Source/GameApplication/Engine/Scene/Component/Operations/ModelRendererRuntime.h"
      - "Source/GameApplication/Engine/Scene/System/Render/Animation/ModelRendererGpuRuntimeStorage.h"
      - "Source/GameApplication/Engine/Scene/System/Render/Animation/RenderSystemAnimationTaskRegistrar.h"
      - "Source/GameApplication/Engine/Scene/System/Render/Animation/RenderSystemAnimationTasks.inl"
      - "Source/GameApplication/Engine/Scene/System/Render/Model/**"
      - "Source/GameApplication/Engine/Scene/System/Render/RenderSystem/renderSystem.cpp"
      - "Source/GameApplication/Engine/Scene/System/Render/RenderSystem/renderSystem.h"
      - "Source/GameApplication/Engine/Scene/System/Render/RenderSystem/Renderable/Model/RenderableModel.cpp"
      - "Source/GameApplication/Service/Graphics/RHI/RHIInterfaces.h"
      - "Source/GameApplication/Service/Graphics/RHI/RHIService.h"
      - "Source/GameApplication/Service/Graphics/RHI/D3D11/D3D11RHIDevice.h"
      - "Tests/ModelRendererGpuRuntimeStorageSmokeTest.cpp"
      - "Tests/ModelGeometryRuntimeStorageSmokeTest.cpp"
      - "Docs/RHI_Device_Ownership_And_Model_Geometry_Revision_Contract.md"
      - ".github/workflows/model-renderer-gpu-runtime.yml"
  workflow_dispatch:

concurrency:
  group: model-renderer-gpu-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dynamic-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile and run entity dynamic GPU runtime contract
        shell: cmd
        run: >-
          cl /nologo /utf-8 /std:c++20 /EHsc /W4 /WX
          /D_CRT_SECURE_NO_WARNINGS
          /wd4100 /wd4201 /wd4458 /wd4471 /MTd
          /I Source
          /I Source/GameApplication
          /I Source/GameApplication/Backends
          /I Source/GameApplication/Engine
          /I Source/GameApplication/Engine/Scene
          /I Source/GameApplication/Service
          Tests/ModelRendererGpuRuntimeStorageSmokeTest.cpp
          /Fe:model-renderer-gpu-runtime-test.exe
          /link /NODEFAULTLIB:yaml-cppd.lib
          && model-renderer-gpu-runtime-test.exe

  shared-geometry-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile and run shared model geometry runtime contract
        shell: cmd
        run: >-
          cl /nologo /utf-8 /std:c++20 /EHsc /W4 /WX
          /D_CRT_SECURE_NO_WARNINGS
          /wd4100 /wd4201 /wd4458 /wd4471 /MTd
          /I Source
          /I Source/GameApplication
          /I Source/GameApplication/Backends
          /I Source/GameApplication/Engine
          /I Source/GameApplication/Engine/Scene
          /I Source/GameApplication/Service
          Tests/ModelGeometryRuntimeStorageSmokeTest.cpp
          d3d11.lib dxgi.lib
          /Fe:model-geometry-runtime-test.exe
          /link /NODEFAULTLIB:yaml-cppd.lib
          /NODEFAULTLIB:DirectXTex_Debug.lib
          && model-geometry-runtime-test.exe
